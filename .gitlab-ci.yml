workflow:
  rules:
    # Skip every merge request pipeline (detached + merged-results + train).
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    # Skip any pipeline running in a fork of this project.
    - if: '$CI_PROJECT_NAMESPACE != "project-tick/projects"'
      when: never
    # Run on the default branch and protected branches/tags only.
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_REF_PROTECTED == "true"'

include:
  - template: Jobs/Dependency-Scanning.gitlab-ci.yml
  - template: Jobs/SAST.gitlab-ci.yml
  - template: Jobs/Secret-Detection.gitlab-ci.yml
