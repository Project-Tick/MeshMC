[workspace]
resolver = "2"
members = [
    "launcher/featureflags",
]

[workspace.package]
edition = "2021"
license = "GPL-3.0-or-later"
authors = ["Project Tick <https://projecttick.org>"]
rust-version = "1.74"

[workspace.dependencies]
cxx = "1.0"
cxx-build = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Keep release builds compact and fast; this code is embedded in the launcher.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
