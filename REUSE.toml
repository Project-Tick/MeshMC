    "2012-2021 MultiMC Contributors",
    "2026 Project Tick",
]
SPDX-License-Identifier = "Apache-2.0"

############################ Third-party material ############################

# Breeze icon theme (launcher/resources/breeze_light, breeze_dark), see
# COPYING.md. KDE's policy wants "LGPL-3.0-only OR LicenseRef-KDE-Accepted-LGPL"
# for Breeze icons; COPYING.md says "version 3 or later".
[[annotations]]
path = [
    "launcher/resources/breeze_light/scalable/**",
    "launcher/resources/breeze_dark/scalable/**",
]
SPDX-FileCopyrightText = "2014 Uri Herrera <uri_herrera@nitrux.in> and others"
SPDX-License-Identifier = "LGPL-3.0-or-later"

# Vendored libraries: build glue the project wrote around them keeps the
# project licence (first entry above); these keep their own.
[[annotations]]
path = "libraries/libnbtplusplus/CMakeLists.txt"
SPDX-FileCopyrightText = "2013, 2015 ljfa-ag"
SPDX-License-Identifier = "LGPL-3.0-or-later"

[[annotations]]
path = "launcher/plugin/plugins/DiscordRPC/vendor/discord_ipc/README.md"
SPDX-FileCopyrightText = [
    "2017 Discord, Inc.",
    "2026 Project Tick",
]
SPDX-License-Identifier = "MIT"

