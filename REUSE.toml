# REUSE 3.x annotations for files that cannot carry a comment header (images,
# translations, JSON, binary test data, fonts, 3D models, ...) and for files
# that have not been given one yet. A header inside a file always wins over
# an entry here (precedence = "closest"), so adding a header later is enough.
#
# Entries are grouped by origin and go from general to specific; where two
# entries match the same file the LAST one applies. Every group marked TODO
# needs a decision or a provenance check by a human before KDE Review. The
# full list is in the KDE Review notes handed over with this file.

version = 1
SPDX-PackageName = "MeshMC"
SPDX-PackageSupplier = "Project Tick"
SPDX-PackageDownloadLocation = "https://github.com/Project-Tick/MeshMC"

############################ Project files (Apache-2.0) ############################

# Build glue, CI, packaging, docs and other text files without a header yet.
# TODO: replace by real headers in the files once nobody is editing them.
[[annotations]]
path = [
    ".gitattributes",
    ".gitignore",
    ".flatpak-manifest.json",
    "**/.gitignore",
    ".github/**",
    "CHANGELOG.md",
    "CMakePresets.json",
    "crowdin.yml",
    "buildconfig/CMakeLists.txt",
    "cmake/**",
    "launcher/CMakeLists.txt",
    "launcher/Messages.sh",
    "launcher/scripts/**",
    "launcher/packaging/**",
    "launcher/plugin/plugins/**/CMakeLists.txt",
    "launcher/plugin/plugins/staging/ErrorOracle/rules/*.json",
    "launcher/plugin/sdk/**",
    "launcher/resources/*/*.qrc",
    "launcher/resources/*/index.theme",
    "launcher/resources/documents/credits.html",
    "launcher/resources/shaders/vshader_skin_background.glsl",
    "launcher/ui/**",
    "libraries/README.md",
    "libraries/*/README.md",
    "libraries/*/CMakeLists.txt",
    "libraries/*/.gitignore",
    "libraries/javacheck/JavaCheck.java",
    "libraries/katabasis/acknowledgements.md",
    "launcher/updater/meshupdater/*.ui",
    "launcher/updater/meshupdater/updater.exe.manifest",
    "README.md",
]
SPDX-FileCopyrightText = [
    "2012-2021 MultiMC Contributors",
    "2026 Project Tick",
]
SPDX-License-Identifier = "Apache-2.0"

# Test data (JSON, jars, shortcut fixtures): trivial, no creative content.
[[annotations]]
path = [
    "launcher/minecraft/testdata/**",
    "launcher/mojang/testdata/**",
    "launcher/testdata/**",
]
SPDX-FileCopyrightText = "2026 Project Tick"
SPDX-License-Identifier = "CC0-1.0"

# Translations come from Crowdin (https://crowdin.com/project/projtlauncher)
# and are licensed like the source they translate.
[[annotations]]
path = "launcher/locale/*.po*"
SPDX-FileCopyrightText = "MeshMC translators"
SPDX-License-Identifier = "Apache-2.0"

# Project originals: icons, app icon, background art.
[[annotations]]
path = [
    "launcher/resources/meshmc/org.projecttick.MeshMC*.svg",
    "launcher/resources/meshmc/*/noaccount.png",
    "launcher/resources/meshmc/*/star.png",
    "launcher/resources/meshmc/scalable/instances/meshmc.svg",
    "launcher/resources/meshmc/scalable/*.svg",
    "launcher/resources/meshmc/*/instances/flame*.png",
