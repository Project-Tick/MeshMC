    "launcher/resources/meshmc/*/instances/magitech.png",
    "launcher/resources/meshmc/*/instances/meat.png",
    "launcher/resources/meshmc/scalable/instances/flame.svg",
    "launcher/resources/meshmc/scalable/instances/gear.svg",
    "launcher/resources/meshmc/scalable/instances/magitech.svg",
    "launcher/resources/meshmc/scalable/instances/meat.svg",
    "launcher/resources/sources/burfcat_hat.png",
    "launcher/resources/sources/cattiversary.xcf",
    "launcher/resources/sources/clucker.svg",
    "launcher/resources/sources/flame.svg",
