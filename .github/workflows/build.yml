name: Build

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.ref_type == 'branch' && 'updater-build-counter' || github.ref }}
  cancel-in-progress: false

on:
  push:
    branches: ['**']
  merge_group:
    types: [checks_requested]
  pull_request:
  workflow_call:
    inputs:
      build-type:
        description: Type of build (Debug or Release)
        type: string
        default: Debug
      environment:
        description: Deployment environment to run under
        type: string
  workflow_dispatch:
    inputs:
      build-type:
        description: Type of build (Debug or Release)
        type: string
        default: Debug

permissions: {}

jobs:
  build-number:
    name: Allocate updater build number
    if: ${{ github.event_name == 'push' && github.ref_type == 'branch' && (github.ref_name == 'master' || github.ref_name == 'develop' || github.ref_name == 'testing') }}
    runs-on: ubuntu-slim
    outputs:
      build-number: ${{ steps.allocate.outputs.build-number }}
    steps:
      - name: Allocate next build number
        id: allocate
        shell: bash
        run: |
          set -euo pipefail
          max_build=0
          page=1
          while true; do
            response="$(curl -sS -w $'\n%{http_code}' \
              "https://api.github.com/repos/Project-Tick/MeshMC-Updates/git/matching-refs/tags/build-?per_page=100&page=${page}")"
            status="${response##*$'\n'}"
            refs="${response%$'\n'*}"
            if [[ "$status" == "409" && "$page" == "1" ]]; then
              break
            fi
            if [[ "$status" != "200" ]]; then
              echo "::error::Could not read build tags (GitHub API status $status)."
              exit 1
            fi
            count="$(python3 -c 'import json,sys; print(len(json.load(sys.stdin)))' <<<"$refs")"
            if [[ "$count" == "0" ]]; then
              break
            fi
            max_build="$(python3 -c 'import json,sys; maximum=int(sys.argv[1]); maximum=max([maximum]+[int(r["ref"][16:]) for r in json.load(sys.stdin) if r.get("ref","").startswith("refs/tags/build-") and r["ref"][16:].isdigit()]); print(maximum)' "$max_build" <<<"$refs")"
            if [[ "$count" -lt 100 ]]; then
              break
            fi
            page=$((page + 1))
          done
          next_build=$((max_build + 1))
          if [[ "$next_build" -gt 65535 ]]; then
            echo "::error::Updater build number $next_build exceeds the Windows version limit."
            exit 1
          fi
          echo "build-number=$next_build" >> "$GITHUB_OUTPUT"
          echo "Allocated updater build $next_build"

  build:
    name: Build (${{ matrix.platform }})
    needs: [build-number]
    if: always() && (needs.build-number.result == 'success' || needs.build-number.result == 'skipped')
    environment: ${{ inputs.environment || '' }}
    permissions:
      contents: read
      packages: read
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: lin64
            image: linux-x64
            architecture: linux/amd64
            archive: tar.gz
            variant: linux-x86_64-qt5.6
            supersedes: [linux-x86_64-qt5]
            requirements: '{"os":"linux","arch":"x86_64","glibc":"2.19","glibcxx":"3.4.21","qt":"5.6.3"}'
          - platform: lin32
            image: linux-x32
            architecture: linux/386
            archive: tar.gz
            variant: linux-x86-qt5.6
            requirements: '{"os":"linux","arch":"x86","glibc":"2.19","glibcxx":"3.4.21","qt":"5.6.3"}'
          - platform: win32
            image: windows-win32
            architecture: linux/amd64
            archive: zip
            variant: windows-x86-qt5.6
            requirements: '{"os":"windows","arch":"x86","os_version":"5.1"}'
          - platform: win32-5.15.2
            image: windows-win32
            architecture: linux/amd64
            archive: zip
            variant: windows-x86-qt5.15
            supersedes: [windows-x86-qt5.6, windows-x86_64-qt5]
            requirements: '{"os":"windows","arch":"x86","os_version":"6.1"}'
          - platform: osx64-5.15.2
            image: macos-osx64
            architecture: linux/amd64
            archive: tar.gz
            variant: macos-x86_64-qt5.15
            supersedes: [macos-aarch64-qt5]
            requirements: '{"os":"macos","arch":"x86_64","os_version":"10.13"}'

    env:
      PLATFORM: ${{ matrix.platform }}
      TOOLCHAIN_IMAGE: ghcr.io/project-tick/meshmc/${{ matrix.image }}:dev
      IMAGE_PLATFORM: ${{ matrix.architecture }}
      BUILD_TYPE: ${{ inputs.build-type || (github.event_name == 'push' && 'Release' || 'Debug') }}
      BUILD_NUMBER: ${{ needs.build-number.outputs.build-number || '-1' }}
      UPDATER_VARIANT: ${{ matrix.variant }}
      UPDATER_PUBLISH_ENABLED: ${{ vars.UPDATER_PUBLISH_ENABLED }}

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Test release tooling
        if: matrix.platform == 'lin64'
        run: python -m unittest -v tools.test_package_release tools.updater_v2.test_publish_release

      - name: Set build output directory
        run: echo "BUILD_OUTPUT=$RUNNER_TEMP/meshmc-build" >> "$GITHUB_ENV"

      - name: Pull toolchain image
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          printf '%s\n' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker pull --platform "$IMAGE_PLATFORM" "$TOOLCHAIN_IMAGE"
          docker logout ghcr.io

      - name: Build and install in toolchain
        run: |
          mkdir -p "$BUILD_OUTPUT"
          updater_site=
          updater_keys=
          if [[ "$BUILD_NUMBER" != -1 && "$UPDATER_PUBLISH_ENABLED" == true ]]; then
            keys=launcher/updater/v2/keys
            if [[ ! -s "$keys/1.json" || ! -s "$keys/1.json.sig" || ! -s "$keys/root-keys.txt" ]]; then
              echo "::error::Updater V2 bootstrap files are missing."
              exit 1
            fi
            cp "$keys/1.json" "$BUILD_OUTPUT/updater-keys-floor.json"
            updater_keys="$(paste -sd ';' "$keys/root-keys.txt")"
            updater_site="https://github.com/Project-Tick/MeshMC-Updates/releases/latest/download/"
          fi

          docker run --rm --init --network none --platform "$IMAGE_PLATFORM" \
            --user "$(id -u):$(id -g)" \
            --env HOME=/tmp --env PLATFORM --env BUILD_TYPE --env BUILD_NUMBER \
            --env UPDATER_VARIANT \
            --env "UPDATER_ROOT_KEYS=$updater_keys" --env "UPDATER_SITE=$updater_site" \
            --volume "$GITHUB_WORKSPACE:/src:ro" --volume "$BUILD_OUTPUT:/out" \
            --entrypoint /bin/bash "$TOOLCHAIN_IMAGE" /src/.github/scripts/build-toolchain.sh

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: logs-${{ matrix.platform }}
          path: ${{ runner.temp }}/meshmc-build/*.log
          if-no-files-found: ignore

      - name: Validate installed launcher architecture
        run: |
          install_dir="$BUILD_OUTPUT/install"
          case "$PLATFORM" in
            lin64)
              test -x "$install_dir/MeshMC/MeshMC"
              file -b "$install_dir/MeshMC/bin/MeshMC" | grep -E "ELF 64-bit.*x86-64"
              ;;
            lin32)
              test -x "$install_dir/MeshMC/MeshMC"
              file -b "$install_dir/MeshMC/bin/MeshMC" | grep -E "ELF 32-bit.*Intel 80386"
              ;;
            win32|win32-5.15.2)
              test -f "$install_dir/MeshMC/Qt5Core.dll"
              test -f "$install_dir/MeshMC/qt.conf"
              test -f "$install_dir/MeshMC/platforms/qwindows.dll"
              launcher="$install_dir/MeshMC/MeshMC.exe"
              file -b "$launcher" | grep -E "PE32 executable.*(Intel 80386|Intel i386)"
              major=5
              if [[ "$PLATFORM" == win32-5.15.2 ]]; then
                major=6
                test -f "$install_dir/MeshMC/libcrypto-1_1.dll"
                test -f "$install_dir/MeshMC/libssl-1_1.dll"
                test -f "$install_dir/MeshMC/msvcr100.dll"
              fi
              objdump -p "$launcher" | awk -v major="$major" '
                $1 == "MajorOSystemVersion" { os_major = $2 }
                $1 == "MinorOSystemVersion" { os_minor = $2 }
                $1 == "MajorSubsystemVersion" { subsys_major = $2 }
                $1 == "MinorSubsystemVersion" { subsys_minor = $2 }
                END {
                  if (os_major != major || os_minor != 1 || subsys_major != major || subsys_minor != 1) {
                    print "Unexpected Windows version in PE header"
                    exit 1
                  }
                }'
              ;;
            osx64-5.15.2)
              test -f "$install_dir/MeshMC.app/Contents/Info.plist"
              file -b "$install_dir/MeshMC.app/Contents/MacOS/MeshMC" | grep -E "Mach-O 64-bit.*x86_64"
              ;;
          esac

      - name: Build and sign the Windows installer
        if: startsWith(matrix.platform, 'win32')
        env:
          WINDOWS_CODESIGN_CERT: ${{ secrets.WINDOWS_CODESIGN_CERT }}
          WINDOWS_CODESIGN_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_PASSWORD }}
        run: bash .github/scripts/package-windows-installer.sh

      - name: Upload Windows installer
        if: startsWith(matrix.platform, 'win32')
        uses: actions/upload-artifact@v7
        with:
          name: package-${{ matrix.platform }}-setup
          path: dist/*-${{ matrix.platform }}-Setup.exe
          compression-level: 0
          if-no-files-found: error

      - name: Package build
        env:
          ARCHIVE_FORMAT: ${{ matrix.archive }}
        run: |
          version="$(git rev-parse --short HEAD)"
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            version="$GITHUB_REF_NAME"
          fi
          bundle=MeshMC
          if [[ "$PLATFORM" == osx64-5.15.2 ]]; then
            bundle=MeshMC.app
          fi
          mkdir -p dist
          python tools/package_release.py \
            --source "$BUILD_OUTPUT/install/$bundle" \
            --output "dist/MeshMC-$version-$PLATFORM.$ARCHIVE_FORMAT" \
            --format "$ARCHIVE_FORMAT" --archive-root "$bundle"

      - name: Upload download package
        uses: actions/upload-artifact@v7
        with:
          name: package-${{ matrix.platform }}
          path: dist/*-${{ matrix.platform }}.${{ matrix.archive }}
          compression-level: 0
          if-no-files-found: error

      - name: Prepare updater payload
        if: needs.build-number.result == 'success' && vars.UPDATER_PUBLISH_ENABLED == 'true'
        env:
          UPDATER_REQUIREMENTS: ${{ matrix.requirements }}
          UPDATER_SUPERSEDES: ${{ join(matrix.supersedes, ' ') }}
        run: |
          source_dir="$BUILD_OUTPUT/install/MeshMC"
          if [[ "$PLATFORM" == osx64-5.15.2 ]]; then
            source_dir="$BUILD_OUTPUT/install/MeshMC.app"
          fi
          read -r -a predecessors <<< "$UPDATER_SUPERSEDES"
          supersedes_args=()
          for predecessor in "${predecessors[@]}"; do
            supersedes_args+=(--supersedes "$predecessor")
          done
          python tools/updater_v2/prepare_payload.py \
            --source "$source_dir" \
            --output "$RUNNER_TEMP/updater-payload" \
            --variant "$UPDATER_VARIANT" \
            --name "MeshMC $PLATFORM" \
            --requirements "$UPDATER_REQUIREMENTS" \
            "${supersedes_args[@]}"

      - name: Upload updater payload
        if: needs.build-number.result == 'success' && vars.UPDATER_PUBLISH_ENABLED == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: updater-${{ matrix.variant }}
          path: ${{ runner.temp }}/updater-payload/*
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

  publish-updater:
    name: Publish Updater V2 release
    needs: [build-number, build]
    if: >-
      needs.build-number.result == 'success' &&
      github.ref_type == 'branch' &&
      vars.UPDATER_PUBLISH_ENABLED == 'true'
    environment: Release
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Download updater payloads
        uses: actions/download-artifact@v8
        with:
          pattern: updater-*
          path: ${{ runner.temp }}/updater-payloads

      - name: Publish signed build release
        env:
          GH_TOKEN: ${{ secrets.UPDATES_REPO_TOKEN }}
          UPDATER_ONLINE_SIGNING_KEY: ${{ secrets.UPDATER_ONLINE_SIGNING_KEY }}
          BUILD_NUMBER: ${{ needs.build-number.outputs.build-number }}
          SOURCE_COMMIT: ${{ github.sha }}
          SOURCE_BRANCH: ${{ github.ref_name }}
        run: |
          if [[ ! -f launcher/updater/v2/keys/1.json || ! -f launcher/updater/v2/keys/1.json.sig || ! -f launcher/updater/v2/keys/root-keys.txt ]]; then
            echo "::error::Updater V2 bootstrap files are missing. Run tools/updater_v2/bootstrap.py and commit its public files first."
            exit 1
          fi
          if [[ -z "$GH_TOKEN" || -z "$UPDATER_ONLINE_SIGNING_KEY" ]]; then
            echo "::error::Configure UPDATES_REPO_TOKEN and UPDATER_ONLINE_SIGNING_KEY in the protected Release environment."
            exit 1
          fi
          signing_key="$RUNNER_TEMP/updater-online-key.pem"
          printf '%s\n' "$UPDATER_ONLINE_SIGNING_KEY" > "$signing_key"
          chmod 600 "$signing_key"
          gh auth setup-git --hostname github.com
          python tools/updater_v2/publish_release.py \
            --payload-root "$RUNNER_TEMP/updater-payloads" \
            --build-number "$BUILD_NUMBER" \
            --commit "$SOURCE_COMMIT" \
            --branch "$SOURCE_BRANCH" \
            --signing-key "$signing_key"
