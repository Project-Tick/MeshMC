name: Build

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

on:
  push:
  merge_group:
    types: [checks_requested]
  pull_request:
  workflow_call:
    inputs:
      build-type:
        description: Type of build (Debug or Release)
        type: string
        default: Debug
      environment:
        description: Deployment environment to run under
        type: string
  workflow_dispatch:
    inputs:
      build-type:
        description: Type of build (Debug or Release)
        type: string
        default: Debug

permissions: {}

jobs:
  build:
    name: Build (${{ matrix.build-name }})

    environment: ${{ inputs.environment || '' }}

    permissions:
      contents: read
      id-token: write
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          # TODO: PORT Qt6
          # - os: ubuntu-26.04
          #   artifact-name: Linux
          #   cmake-preset: linux
          #   qt-version: 6.12.0
          #   qt-major: 6
          #   build-name: Linux x86_64 Qt6

          # - os: ubuntu-26.04-arm
          #   artifact-name: Linux-aarch64
          #   cmake-preset: linux
          #   qt-version: 6.12.0
          #   qt-major: 6
          #   build-name: Linux aarch64 Qt6

          # - os: windows-2025
          #   artifact-name: Windows-MinGW-w64
          #   cmake-preset: windows_mingw
          #   msystem: CLANG64
          #   vcvars-arch: amd64_x86
          #   qt-major: 6
          #   build-name: Windows MinGW x86_64 Qt6

          # - os: windows-2025-vs2026
          #   artifact-name: Windows-MSVC
          #   cmake-preset: windows_msvc
          #   # TODO(@YongDo-Hyun): This is the default in setup-dependencies/windows. Why isn't it working?!?!
          #   vcvars-arch: amd64
          #   qt-version: 6.12.0
          #   qt-major: 6
          #   build-name: Windows MSVC x86_64 Qt6

          # - os: windows-11-vs2026-arm
          #   artifact-name: Windows-MSVC-arm64
          #   cmake-preset: windows_msvc
          #   vcvars-arch: arm64
          #   qt-version: 6.12.0
          #   qt-major: 6
          #   build-name: Windows MSVC aarch64 Qt6

          # - os: macos-26
          #   artifact-name: macOS
          #   cmake-preset: macos_universal
          #   macosx-deployment-target: 14.0
          #   qt-version: 6.12.0
          #   qt-major: 6
          #   build-name: macOS Universal Qt6

          # - os: macos-26
          #   artifact-name: Legacy-macOS
          #   cmake-preset: macos_universal
          #   macosx-deployment-target: 12.0
          #   qt-version: 6.9.3
          #   qt-major: 6
          #   build-name: macOS Universal Legacy Qt6

          - os: ubuntu-26.04
            artifact-name: Linux
            cmake-preset: linux
            qt-version: 5.15.2
            qt-major: 5
            updater-variant: linux-x86_64-qt5
            updater-name: Linux x86_64 Qt 5
            updater-requirements: '{"os":"linux","arch":"x86_64","glibc":"2.19","glibcxx":"3.4.21","qt":"5.15.2"}'
            build-platform: lin64
            build-name: Linux x86_64 Qt5

          - os: windows-2025
            artifact-name: Windows-MinGW-w64
            cmake-preset: windows_mingw
            msystem: CLANG64
            vcvars-arch: amd64_x86
            qt-major: 5
            updater-variant: windows-x86_64-qt5-mingw
            updater-name: Windows x86_64 Qt 5 MinGW
            updater-requirements: '{"os":"windows","arch":"x86_64","os_version":"10.0"}'
            build-platform: win64
            build-name: Windows MinGW x86_64 Qt5

          - os: windows-2022
            artifact-name: Windows-MSVC
            cmake-preset: windows_msvc
            # TODO(@YongDo-Hyun): This is the default in setup-dependencies/windows. Why isn't it working?!?!
            vcvars-arch: amd64
            qt-version: 5.15.2
            qt-major: 5
            updater-variant: windows-x86_64-qt5-msvc
            updater-name: Windows x86_64 Qt 5 MSVC
            updater-requirements: '{"os":"windows","arch":"x86_64","os_version":"10.0"}'
            build-platform: win64
            build-name: Windows MSVC x86_64 Qt5

          - os: macos-26
            artifact-name: macOS-ARM
            cmake-preset: macos
            macosx-deployment-target: 12.0
            qt-major: 5
            updater-variant: macos-aarch64-qt5
            updater-name: macOS aarch64 Qt 5
            updater-requirements: '{"os":"macos","arch":"aarch64","os_version":"12.0"}'
            build-platform: macos
            build-name: macOS aarch64 Qt5

    runs-on: ${{ matrix.os }}

    defaults:
      run:
        shell: ${{ matrix.msystem != '' && 'msys2 {0}' || 'bash' }}

    env:
      ARTIFACT_NAME: ${{ matrix.artifact-name }}-Qt${{ matrix.qt-major }}
      BUILD_PLATFORM: official
      BUILD_TYPE: ${{ inputs.build-type || (github.event_name == 'push' && github.ref_type == 'branch' && 'Release' || 'Debug') }}
      CMAKE_PRESET: ${{ matrix.cmake-preset }}
      UPDATE_CHANNEL: stable
      QT_MAJOR: ${{ matrix.qt-major }}
      UPDATER_PUBLISH_ENABLED: ${{ vars.UPDATER_PUBLISH_ENABLED }}
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macosx-deployment-target }}

    steps:
      ##
      # SETUP
      ##

      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Setup dependencies
        id: setup-dependencies
        uses: ./.github/actions/setup-dependencies
        with:
          build-type: ${{ env.BUILD_TYPE }}
          artifact-name: ${{ matrix.artifact-name }}
          msystem: ${{ matrix.msystem }}
          vcvars-arch: ${{ matrix.vcvars-arch }}
          qt-version: ${{ matrix.qt-version }}
          qt-major: ${{ matrix.qt-major }}

      ##
      # BUILD
      ##

      - name: Configure project
        run: |
          updater_args=()
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF_TYPE" == "branch" ]]; then
            updater_args+=(
              -DLauncher_VERSION_BUILD="$GITHUB_RUN_NUMBER"
              -DLauncher_BUILD_PLATFORM="${{ matrix.build-platform }}"
            )
            if [[ "$UPDATER_PUBLISH_ENABLED" == "true" && ( ! -f launcher/updater/v2/keys/1.json || ! -f launcher/updater/v2/keys/1.json.sig || ! -f launcher/updater/v2/keys/root-keys.txt ) ]]; then
              echo "::error::Updater V2 bootstrap files are missing. Run tools/updater_v2/bootstrap.py and commit its public files first."
              exit 1
            fi
            if [[ "$UPDATER_PUBLISH_ENABLED" == "true" ]]; then
              root_keys="$(paste -sd ';' launcher/updater/v2/keys/root-keys.txt)"
              updater_args+=(
                -DLauncher_UPDATER_ROOT_KEYS="$root_keys"
                -DLauncher_UPDATER_KEYS_FLOOR="$GITHUB_WORKSPACE/launcher/updater/v2/keys/1.json"
                -DLauncher_UPDATER_VARIANT="${{ matrix.updater-variant }}"
                -DLauncher_UPDATER_SITE="https://github.com/Project-Tick/MeshMC-Updates/releases/latest/download/"
              )
            fi
          fi
          cmake --preset "$CMAKE_PRESET" -D VCPKG_HOST_TRIPLET="$VCPKG_TRIPLET" -D VCPKG_TARGET_TRIPLET="$VCPKG_TRIPLET" -DMeshMC_QT_VERSION_MAJOR="$QT_MAJOR" -DMeshMC_BUNDLE_OPENSSL_LIBS="${MESHMC_BUNDLE_OPENSSL_LIBS:-}" "${updater_args[@]}"

      - name: Run build
        run: |
          cmake --build --preset "$CMAKE_PRESET" --config "$BUILD_TYPE"

      - name: Run tests
        run: |
          ctest --preset "$CMAKE_PRESET" --build-config "$BUILD_TYPE" --output-on-failure

      - name: Test updater release tooling
        if: ${{ runner.os == 'Linux' }}
        run: |
          python -m unittest -v tools.updater_v2.test_publish_release

      ##
      # PACKAGE
      ##

      - name: Get short version
        id: short-version
        shell: bash
        run: |
          echo "version=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Package (Linux)
        if: ${{ runner.os == 'Linux' }}
        uses: ./.github/actions/package/linux
        with:
          version: ${{ steps.short-version.outputs.version }}
          build-type: ${{ steps.setup-dependencies.outputs.build-type }}
          artifact-name: ${{ matrix.artifact-name }}
          qt-version: ${{ steps.setup-dependencies.outputs.qt-version }}
          qt-major: ${{ matrix.qt-major }}

          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-private-key-id: ${{ secrets.GPG_PRIVATE_KEY_ID }}

      - name: Package (macOS)
        if: ${{ runner.os == 'macOS' }}
        uses: ./.github/actions/package/macos
        with:
          version: ${{ steps.short-version.outputs.version }}
          build-type: ${{ steps.setup-dependencies.outputs.build-type }}
          artifact-name: ${{ matrix.artifact-name }}
          qt-major: ${{ matrix.qt-major }}

          apple-codesign-cert: ${{ secrets.APPLE_CODESIGN_CERT }}
          apple-codesign-password: ${{ secrets.APPLE_CODESIGN_PASSWORD }}
          apple-codesign-id: ${{ secrets.APPLE_CODESIGN_ID }}
          apple-notarize-apple-id: ${{ secrets.APPLE_NOTARIZE_APPLE_ID }}
          apple-notarize-team-id: ${{ secrets.APPLE_NOTARIZE_TEAM_ID }}
          apple-notarize-password: ${{ secrets.APPLE_NOTARIZE_PASSWORD }}
          sparkle-ed25519-key: ${{ secrets.SPARKLE_ED25519_KEY }}

      - name: Package (Windows)
        if: ${{ runner.os == 'Windows' }}
        uses: ./.github/actions/package/windows
        with:
          version: ${{ steps.short-version.outputs.version }}
          build-type: ${{ env.BUILD_TYPE }}
          artifact-name: ${{ matrix.artifact-name }}
          windows-codesign-cert: ${{ secrets.WINDOWS_CODESIGN_CERT }}
          windows-codesign-password: ${{ secrets.WINDOWS_CODESIGN_PASSWORD }}
          msystem: ${{ matrix.msystem }}
          qt-major: ${{ matrix.qt-major }}

      - name: Prepare updater payload
        if: ${{ github.event_name == 'push' && github.ref_type == 'branch' }}
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Linux) source_dir=install-portable ;;
            Windows|macOS) source_dir=install ;;
            *) echo "::error::Unsupported updater runner OS: $RUNNER_OS"; exit 1 ;;
          esac
          python "$GITHUB_WORKSPACE/tools/updater_v2/prepare_payload.py" \
            --source "$GITHUB_WORKSPACE/$source_dir" \
            --output "$RUNNER_TEMP/updater-payload" \
            --variant "${{ matrix.updater-variant }}" \
            --name "${{ matrix.updater-name }}" \
            --requirements '${{ matrix.updater-requirements }}'

      - name: Upload updater payload
        if: ${{ github.event_name == 'push' && github.ref_type == 'branch' }}
        uses: actions/upload-artifact@v7
        with:
          name: updater-${{ matrix.updater-variant }}
          path: ${{ runner.temp }}/updater-payload/*
          if-no-files-found: error
          retention-days: 1

  publish-updater:
    name: Publish Updater V2 release
    needs: [build]
    if: >-
      github.event_name == 'push' &&
      github.ref_type == 'branch' &&
      vars.UPDATER_PUBLISH_ENABLED == 'true'
    environment: Release
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Download updater payloads
        uses: actions/download-artifact@v8
        with:
          pattern: updater-*
          path: ${{ runner.temp }}/updater-payloads

      - name: Publish signed build release
        env:
          GH_TOKEN: ${{ secrets.UPDATES_REPO_TOKEN }}
          UPDATER_ONLINE_SIGNING_KEY: ${{ secrets.UPDATER_ONLINE_SIGNING_KEY }}
          BUILD_NUMBER: ${{ github.run_number }}
          SOURCE_COMMIT: ${{ github.sha }}
          SOURCE_BRANCH: ${{ github.ref_name }}
        run: |
          if [[ ! -f launcher/updater/v2/keys/1.json || ! -f launcher/updater/v2/keys/1.json.sig || ! -f launcher/updater/v2/keys/root-keys.txt ]]; then
            echo "::error::Updater V2 bootstrap files are missing. Run tools/updater_v2/bootstrap.py and commit its public files first."
            exit 1
          fi
          if [[ -z "$GH_TOKEN" || -z "$UPDATER_ONLINE_SIGNING_KEY" ]]; then
            echo "::error::Configure UPDATES_REPO_TOKEN and UPDATER_ONLINE_SIGNING_KEY in the protected Release environment."
            exit 1
          fi
          signing_key="$RUNNER_TEMP/updater-online-key.pem"
          printf '%s\n' "$UPDATER_ONLINE_SIGNING_KEY" > "$signing_key"
          chmod 600 "$signing_key"
          python tools/updater_v2/publish_release.py \
            --payload-root "$RUNNER_TEMP/updater-payloads" \
            --build-number "$BUILD_NUMBER" \
            --commit "$SOURCE_COMMIT" \
            --branch "$SOURCE_BRANCH" \
            --signing-key "$signing_key"
