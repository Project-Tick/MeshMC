name: Build

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - 'develop'
      - 'release-*'
  merge_group:
    types: [checks_requested]
  pull_request:
  workflow_call:
    inputs:
      build-type:
        description: Type of build (Debug or Release)
        type: string
        default: Debug
      environment:
        description: Deployment environment to run under
        type: string
  workflow_dispatch:
    inputs:
      build-type:
        description: Type of build (Debug or Release)
        type: string
        default: Debug

permissions: {}

jobs:
  build:
    name: Build (${{ matrix.build-name }})

    environment: ${{ inputs.environment || '' }}

    permissions:
      contents: read
      id-token: write
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux builds in Fedora: Qt 6 and KDE Frameworks 6 from its
          # packages (see .github/actions/setup-dependencies/linux).
          - os: ubuntu-24.04
            container: fedora:44
            artifact-name: Linux
            cmake-preset: linux
            qt-version: 6.10.2
            qt-major: 6
            build-name: Linux x86_64 Qt6

          - os: ubuntu-24.04-arm
            container: fedora:44
            artifact-name: Linux-aarch64
            cmake-preset: linux
            qt-version: 6.10.2
            qt-major: 6
            build-name: Linux aarch64 Qt6

          - os: windows-2025
            artifact-name: Windows-MinGW-w64
            cmake-preset: windows_mingw
            msystem: CLANG64
            vcvars-arch: amd64_x86
            qt-major: 6
            build-name: Windows MinGW x86_64 Qt6

          - os: windows-2025-vs2026
            artifact-name: Windows-MSVC
            cmake-preset: windows_msvc
            # TODO(@YongDo-Hyun): This is the default in setup-dependencies/windows. Why isn't it working?!?!
            vcvars-arch: amd64
            qt-version: 6.10.2
            qt-major: 6
            build-name: Windows MSVC x86_64 Qt6

          # MinGW rather than MSVC on arm64: KDE Craft has no Windows arm64
          # cache and vcpkg is gone, while MSYS2's CLANGARM64 carries Qt, KDE
          # Frameworks 6 and every other library this build needs.
          - os: windows-11-vs2026-arm
            artifact-name: Windows-MinGW-arm64
            cmake-preset: windows_mingw
            msystem: CLANGARM64
            vcvars-arch: arm64
            qt-major: 6
            build-name: Windows MinGW aarch64 Qt6

          # Apple Silicon only: KDE Craft's cache, where Qt and KDE
          # Frameworks 6 come from on macOS, is built per architecture
          # (macos-arm-clang, macos-64-clang), so no universal binary; 13.3 is
          # the deployment target that cache is built for.
          - os: macos-26
            artifact-name: macOS
            cmake-preset: macos
            macosx-deployment-target: 13.3
            qt-major: 6
            build-name: macOS arm64 Qt6

    runs-on: ${{ matrix.os }}
    # Empty for everything but Linux, which then runs on the runner itself.
    container: ${{ matrix.container }}

    defaults:
      run:
        shell: ${{ matrix.msystem != '' && 'msys2 {0}' || 'bash' }}

    env:
      ARTIFACT_NAME: ${{ matrix.artifact-name }}-Qt${{ matrix.qt-major }}
      BUILD_PLATFORM: official
      BUILD_TYPE: ${{ inputs.build-type || 'Debug' }}
      CMAKE_PRESET: ${{ matrix.cmake-preset }}
      UPDATE_CHANNEL: stable
      QT_MAJOR: ${{ matrix.qt-major }}

      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macosx-deployment-target }}

    steps:
      ##
      # SETUP
      ##

      # actions/checkout needs git for the submodules; Fedora's image has none.
      - name: Install git (Linux container)
        if: ${{ matrix.container != '' }}
        run: dnf -y install git-core

      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Setup dependencies
        id: setup-dependencies
        uses: ./.github/actions/setup-dependencies
        with:
          build-type: ${{ env.BUILD_TYPE }}
          artifact-name: ${{ matrix.artifact-name }}
          msystem: ${{ matrix.msystem }}
          vcvars-arch: ${{ matrix.vcvars-arch }}
          qt-version: ${{ matrix.qt-version }}
          qt-major: ${{ matrix.qt-major }}

      ##
      # BUILD
      ##

      - name: Configure project
        run: |
          cmake --preset "$CMAKE_PRESET" -D VCPKG_HOST_TRIPLET="$VCPKG_TRIPLET" -D VCPKG_TARGET_TRIPLET="$VCPKG_TRIPLET" -DMeshMC_QT_VERSION_MAJOR="$QT_MAJOR" -DMeshMC_BUNDLE_OPENSSL_LIBS="${MESHMC_BUNDLE_OPENSSL_LIBS:-}"

      - name: Run build
        run: |
          cmake --build --preset "$CMAKE_PRESET" --config "$BUILD_TYPE"

      - name: Run tests
        run: |
          ctest --preset "$CMAKE_PRESET" --build-config "$BUILD_TYPE" --output-on-failure

      - name: Check plugin independence
        shell: bash
        run: |
          ./launcher/scripts/check-plugin-independence.sh

      ##
      # PACKAGE
      ##

      - name: Get short version
        id: short-version
        shell: bash
        run: |
          echo "version=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Package (Linux)
        if: ${{ runner.os == 'Linux' }}
        uses: ./.github/actions/package/linux
        with:
          version: ${{ steps.short-version.outputs.version }}
          build-type: ${{ steps.setup-dependencies.outputs.build-type }}
          artifact-name: ${{ matrix.artifact-name }}
          qt-version: ${{ steps.setup-dependencies.outputs.qt-version }}
          qt-major: ${{ matrix.qt-major }}

          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-private-key-id: ${{ secrets.GPG_PRIVATE_KEY_ID }}

      - name: Package (macOS)
        if: ${{ runner.os == 'macOS' }}
        uses: ./.github/actions/package/macos
        with:
          version: ${{ steps.short-version.outputs.version }}
          build-type: ${{ steps.setup-dependencies.outputs.build-type }}
          artifact-name: ${{ matrix.artifact-name }}
          qt-major: ${{ matrix.qt-major }}

          apple-codesign-cert: ${{ secrets.APPLE_CODESIGN_CERT }}
          apple-codesign-password: ${{ secrets.APPLE_CODESIGN_PASSWORD }}
          apple-codesign-id: ${{ secrets.APPLE_CODESIGN_ID }}
          apple-notarize-apple-id: ${{ secrets.APPLE_NOTARIZE_APPLE_ID }}
          apple-notarize-team-id: ${{ secrets.APPLE_NOTARIZE_TEAM_ID }}
          apple-notarize-password: ${{ secrets.APPLE_NOTARIZE_PASSWORD }}
          sparkle-ed25519-key: ${{ secrets.SPARKLE_ED25519_KEY }}

      - name: Package (Windows)
        if: ${{ runner.os == 'Windows' }}
        uses: ./.github/actions/package/windows
        with:
          version: ${{ steps.short-version.outputs.version }}
          build-type: ${{ env.BUILD_TYPE }}
          artifact-name: ${{ matrix.artifact-name }}
          windows-codesign-cert: ${{ secrets.WINDOWS_CODESIGN_CERT }}
          windows-codesign-password: ${{ secrets.WINDOWS_CODESIGN_PASSWORD }}
          msystem: ${{ matrix.msystem }}
          qt-major: ${{ matrix.qt-major }}
