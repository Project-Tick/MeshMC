name: Build Application and Make Release

on:
  push:
    tags:
      - "*"

permissions: {}

jobs:
  build_release:
    name: Build Release
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read
      id-token: write
      packages: write
    with:
      build-type: Release
      environment: Release
    secrets: inherit

  create_release:
    needs: build_release
    permissions:
      contents: write
    runs-on: ubuntu-slim
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
      - name: Grab and store version
        run: |
          echo "VERSION=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
      - name: Collect release packages
        run: |
          set -euo pipefail
          mv "MeshMC-Qt5-Linux-x86_64/MeshMC-Qt5-Linux-x86_64-${VERSION}.tar.gz" .
          mv "MeshMC-Qt5-Windows-x86_64/MeshMC-Qt5-Windows-x86_64-${VERSION}.zip" .
          mv "MeshMC-Qt5-Windows-x86_64-Setup/MeshMC-Qt5-Windows-x86_64-Setup-${VERSION}.exe" .
          mv "MeshMC-Qt5-macOS-aarch64/MeshMC-Qt5-macOS-aarch64-${VERSION}.tar.gz" .

      - name: Create release
        id: create_release
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ github.ref }}
          name: MeshMC ${{ env.VERSION }}
          draft: true
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            MeshMC-Qt5-Linux-x86_64-${{ env.VERSION }}.tar.gz
            MeshMC-Qt5-Windows-x86_64-${{ env.VERSION }}.zip
            MeshMC-Qt5-Windows-x86_64-Setup-${{ env.VERSION }}.exe
            MeshMC-Qt5-macOS-aarch64-${{ env.VERSION }}.tar.gz
