name: Build Translations and Serve

on:
  push:
    branches:
      - "master"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup dependencies
        id: setup-dependencies
        uses: ./.github/actions/setup-dependencies
        with:
          build-type: "Release"
          artifact-name: "Linux"
          qt-version: "6.10.2"

      - name: Build translations
        working-directory: locale
        run: ./release.sh

      - name: Move directory
        working-directory: locale
        run: |
          mv build _site
          cp .github/CNAME _site/CNAME

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          publish_dir: ./locale/_site
          github_token: ${{ secrets.GITHUB_TOKEN }}
