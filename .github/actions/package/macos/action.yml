name: Package for macOS
description: Create a macOS package for MeshMC

inputs:
  version:
    description: Launcher version
    required: true
  build-type:
    description: Type for the build
    required: true
    default: Debug
  artifact-name:
    description: Name of the uploaded artifact
    required: true
    default: macOS
  qt-major:
    description: Major version of Qt used, to keep artifact names distinct
    required: false
    default: "6"

runs:
  using: composite

  steps:
    - name: Package
      shell: bash
      env:
        BUILD_DIR: build
        INSTALL_DIR: install
        APPLE_CODESIGN_ID: ${{ inputs.apple-codesign-id }}
      run: |
        cmake --install ${{ env.BUILD_DIR }} --config ${{ inputs.build-type }}

        cd ${{ env.INSTALL_DIR }}
        test -d MeshMC.app
        test -f MeshMC.app/Contents/Info.plist
        chmod -R u+w MeshMC.app

        if command -v macdeployqt >/dev/null 2>&1; then
          macdeployqt MeshMC.app -always-overwrite -verbose=1
        elif [[ -n "${Qt5_ROOT:-}" && -x "$Qt5_ROOT/bin/macdeployqt" ]]; then
          "$Qt5_ROOT/bin/macdeployqt" MeshMC.app -always-overwrite -verbose=1
        else
          qt_prefix="$(brew --prefix qt@5)"
          if [[ -x "$qt_prefix/bin/macdeployqt" ]]; then
            "$qt_prefix/bin/macdeployqt" MeshMC.app -always-overwrite -verbose=1
          else
            echo "::error::macdeployqt is missing."
            exit 1
          fi
        fi
        chmod -R u+w MeshMC.app

        main_binary_name="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' MeshMC.app/Contents/Info.plist)"
        main_binary="MeshMC.app/Contents/MacOS/$main_binary_name"
        chmod +x "$main_binary"

    - name: Create DMG
      shell: bash
      run: |
        mkdir -p src
        cp -R "install/MeshMC.app" src/

        ln -s /Applications src/

        hdiutil create \
            -volname "MeshMC ${{ inputs.version }}" \
            -srcfolder src \
            -ov -format ULMO \
            "MeshMC.dmg"

    - name: Upload binary tarball
      uses: actions/upload-artifact@v7
      with:
        name: MeshMC-Qt${{ inputs.qt-major }}-${{ inputs.artifact-name }}-${{ inputs.version }}-${{ inputs.build-type }}
        path: MeshMC.zip

    - name: Upload disk image
      uses: actions/upload-artifact@v7
      with:
        name: MeshMC-Qt${{ inputs.qt-major }}-${{ inputs.artifact-name }}-${{ inputs.version }}-${{ inputs.build-type }}.dmg
        path: MeshMC.dmg
