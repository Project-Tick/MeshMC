name: Package for macOS
description: Create a macOS package for MeshMC

inputs:
  version:
    description: Launcher version
    required: true
  build-type:
    description: Type for the build
    required: true
    default: Debug
  qt-major:
    description: Major version of Qt used, to keep artifact names distinct
    required: false
    default: "6"

runs:
  using: composite

  steps:
    - name: Package
      shell: bash
      env:
        BUILD_DIR: build
        INSTALL_DIR: install
        PACKAGE_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || inputs.version }}
      run: |
        cmake --install "$BUILD_DIR" --config ${{ inputs.build-type }}

        cd "$INSTALL_DIR"
        test -d MeshMC.app
        test -f MeshMC.app/Contents/Info.plist
        chmod -R u+w MeshMC.app

        if command -v macdeployqt >/dev/null 2>&1; then
          macdeployqt MeshMC.app -always-overwrite -verbose=1
        elif [[ -n "${Qt5_ROOT:-}" && -x "$Qt5_ROOT/bin/macdeployqt" ]]; then
          "$Qt5_ROOT/bin/macdeployqt" MeshMC.app -always-overwrite -verbose=1
        else
          qt_prefix="$(brew --prefix qt@5)"
          if [[ -x "$qt_prefix/bin/macdeployqt" ]]; then
            "$qt_prefix/bin/macdeployqt" MeshMC.app -always-overwrite -verbose=1
          else
            echo "::error::macdeployqt is missing."
            exit 1
          fi
        fi
        chmod -R u+w MeshMC.app

        main_binary_name="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' MeshMC.app/Contents/Info.plist)"
        main_binary="MeshMC.app/Contents/MacOS/$main_binary_name"
        chmod +x "$main_binary"
        package="$GITHUB_WORKSPACE/MeshMC-Qt${{ inputs.qt-major }}-macOS-aarch64-${PACKAGE_VERSION}.tar.gz"
        python "$GITHUB_WORKSPACE/tools/package_release.py" \
          --source "$GITHUB_WORKSPACE/$INSTALL_DIR/MeshMC.app" \
          --output "$package" \
          --format tar.gz \
          --archive-root MeshMC.app
        test -s "$package"

    - name: Upload macOS archive
      uses: actions/upload-artifact@v7
      with:
        name: MeshMC-Qt${{ inputs.qt-major }}-macOS-aarch64
        path: ${{ github.workspace }}/MeshMC-Qt${{ inputs.qt-major }}-macOS-aarch64-*.tar.gz
        if-no-files-found: error
