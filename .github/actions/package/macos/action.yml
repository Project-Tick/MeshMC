name: Package for macOS
description: Create a macOS package for MeshMC

inputs:
  version:
    description: Launcher version
    required: true
  build-type:
    description: Type for the build
    required: true
    default: Debug
  artifact-name:
    description: Name of the uploaded artifact
    required: true
    default: macOS
  apple-codesign-cert:
    description: Certificate for signing macOS builds
    required: false
  apple-codesign-password:
    description: Password for signing macOS builds
    required: false
  apple-codesign-id:
    description: Certificate ID for signing macOS builds
    required: false
  apple-notarize-apple-id:
    description: Apple ID used for notarizing macOS builds
    required: false
  apple-notarize-team-id:
    description: Team ID used for notarizing macOS builds
    required: false
  apple-notarize-password:
    description: Password used for notarizing macOS builds
    required: false
  sparkle-ed25519-key:
    description: Private key for signing Sparkle updates
    required: false
  qt-major:
    description: Major version of Qt used, to keep artifact names distinct
    required: false
    default: "6"

runs:
  using: composite

  steps:
    - name: Fetch codesign certificate
      shell: bash
      env:
        APPLE_CODESIGN_CERT: ${{ inputs.apple-codesign-cert }}
        APPLE_CODESIGN_PASSWORD: ${{ inputs.apple-codesign-password }}
        APPLE_CODESIGN_ID: ${{ inputs.apple-codesign-id }}
      run: |
        if [[ -n "$APPLE_CODESIGN_ID" ]]; then
          if [[ -z "$APPLE_CODESIGN_CERT" || -z "$APPLE_CODESIGN_PASSWORD" ]]; then
            echo "::error::The Apple signing certificate and password are both required when a signing ID is set."
            exit 1
          fi
          printf '%s' "$APPLE_CODESIGN_CERT" | base64 --decode > codesign.p12
          security create-keychain -p "$APPLE_CODESIGN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$APPLE_CODESIGN_PASSWORD" build.keychain
          security import codesign.p12 -k build.keychain -P "$APPLE_CODESIGN_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$APPLE_CODESIGN_PASSWORD" build.keychain
        else
          : > codesign.p12
          echo ":warning: Using ad-hoc code signing for macOS, as certificate was not present." >> $GITHUB_STEP_SUMMARY
        fi

    - name: Package
      shell: bash
      env:
        BUILD_DIR: build
        INSTALL_DIR: install
        APPLE_CODESIGN_ID: ${{ inputs.apple-codesign-id }}
      run: |
        cmake --install ${{ env.BUILD_DIR }} --config ${{ inputs.build-type }}

        cd ${{ env.INSTALL_DIR }}
        test -d MeshMC.app
        test -f MeshMC.app/Contents/Info.plist
        chmod -R u+w MeshMC.app

        if command -v macdeployqt >/dev/null 2>&1; then
          macdeployqt MeshMC.app -always-overwrite -verbose=1
        elif [[ -n "${Qt5_ROOT:-}" && -x "$Qt5_ROOT/bin/macdeployqt" ]]; then
          "$Qt5_ROOT/bin/macdeployqt" MeshMC.app -always-overwrite -verbose=1
        else
          qt_prefix="$(brew --prefix qt@5)"
          if [[ -x "$qt_prefix/bin/macdeployqt" ]]; then
            "$qt_prefix/bin/macdeployqt" MeshMC.app -always-overwrite -verbose=1
          else
            echo "::error::macdeployqt is missing."
            exit 1
          fi
        fi
        chmod -R u+w MeshMC.app

        if [[ -n "$APPLE_CODESIGN_ID" ]]; then
          timestamp_flag=(--timestamp)
        else
          APPLE_CODESIGN_ID='-'
          timestamp_flag=(--timestamp=none)
        fi

        sign_nested() {
          [ -e "$1" ] || return 0
          chmod -R u+w "$1" 2>/dev/null || true
          echo "Signing $1"
          codesign --sign "$APPLE_CODESIGN_ID" --force --options runtime "${timestamp_flag[@]}" "$1"
        }

        for framework in MeshMC.app/Contents/Frameworks/*.framework; do
          [[ -L "$framework" ]] && continue
          [ -d "$framework" ] || continue
          for xpc in "$framework"/Versions/*/XPCServices/*.xpc; do
            sign_nested "$xpc"
          done
          for helper in "$framework"/Versions/*/Autoupdate "$framework"/Versions/*/Updater.app; do
            sign_nested "$helper"
          done
        done

        for framework in MeshMC.app/Contents/Frameworks/*.framework; do
          sign_nested "$framework"
        done

        find MeshMC.app/Contents -type f \( -name '*.dylib' -o -name '*.so' -o -name '*.mmco' \) -print0 |
          while IFS= read -r -d '' lib; do
            sign_nested "$lib"
          done

        for binary in meshmc-updater meshmc-crashreporter; do
          path="MeshMC.app/Contents/MacOS/$binary"
          if [ ! -f "$path" ]; then
            echo "::notice::$path not present, nothing to sign."
            continue
          fi
          chmod +x "$path"
          sign_nested "$path"
        done

        main_binary_name="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' MeshMC.app/Contents/Info.plist)"
        main_binary="MeshMC.app/Contents/MacOS/$main_binary_name"
        chmod +x "$main_binary"
        echo "Signing MeshMC.app"
        codesign --sign "$APPLE_CODESIGN_ID" --force \
          --options runtime "${timestamp_flag[@]}" \
          MeshMC.app

        codesign --verify --deep --strict --verbose=2 MeshMC.app

    - name: Notarize
      shell: bash
      env:
        INSTALL_DIR: install
        APPLE_NOTARIZE_APPLE_ID: ${{ inputs.apple-notarize-apple-id }}
        APPLE_NOTARIZE_TEAM_ID: ${{ inputs.apple-notarize-team-id }}
        APPLE_NOTARIZE_PASSWORD: ${{ inputs.apple-notarize-password }}
      run: |
        cd ${{ env.INSTALL_DIR }}

        if [[ -n "$APPLE_NOTARIZE_PASSWORD" ]]; then
          if [[ -z "$APPLE_NOTARIZE_APPLE_ID" || -z "$APPLE_NOTARIZE_TEAM_ID" ]]; then
            echo "::error::Apple ID and team ID are required when notarization credentials are set."
            exit 1
          fi
          ditto -c -k --sequesterRsrc --keepParent "MeshMC.app" ../MeshMC.zip
          xcrun notarytool submit ../MeshMC.zip \
            --wait --progress \
            --apple-id "$APPLE_NOTARIZE_APPLE_ID" \
            --team-id "$APPLE_NOTARIZE_TEAM_ID" \
            --password "$APPLE_NOTARIZE_PASSWORD"

          xcrun stapler staple "MeshMC.app"
        else
          echo ":warning: Skipping notarization as credentials are not present." >> $GITHUB_STEP_SUMMARY
        fi
        ditto -c -k --sequesterRsrc --keepParent "MeshMC.app" ../MeshMC.zip

    - name: Create DMG
      shell: bash
      env:
        INSTALL_DIR: install
      run: |
        cd ${{ env.INSTALL_DIR }}

        mkdir -p src
        cp -R "MeshMC.app" src/

        ln -s /Applications src/

        hdiutil create \
            -volname "MeshMC ${{ inputs.version }}" \
            -srcfolder src \
            -ov -format ULMO \
            "../MeshMC.dmg"

    - name: Make Sparkle signature
      shell: bash
      env:
        SPARKLE_ED25519_KEY: ${{ inputs.sparkle-ed25519-key }}
      run: |
        if [[ -n "$SPARKLE_ED25519_KEY" ]]; then
          printf '%s\n' "$SPARKLE_ED25519_KEY" > ed25519-priv.pem
          OPENSSL=$(brew --prefix openssl@3)/bin/openssl
          signature_zip=$("$OPENSSL" pkeyutl -sign -rawin -in ${{ github.workspace }}/MeshMC.zip -inkey ed25519-priv.pem | openssl base64 | tr -d \\n)
          signature_dmg=$("$OPENSSL" pkeyutl -sign -rawin -in ${{ github.workspace }}/MeshMC.dmg -inkey ed25519-priv.pem | openssl base64 | tr -d \\n)
          rm ed25519-priv.pem
          cat >> $GITHUB_STEP_SUMMARY << EOF
        ### Artifact Information :information_source:
        - :memo: Sparkle Signature (ed25519): \`$signature_zip\` (ZIP)
        - :memo: Sparkle Signature (ed25519): \`$signature_dmg\` (DMG)
        EOF
        else
          cat >> $GITHUB_STEP_SUMMARY << EOF
        ### Artifact Information :information_source:
        - :warning: Sparkle Signature (ed25519): No private key available (likely a pull request or fork)
        EOF
        fi

    - name: Upload binary tarball
      uses: actions/upload-artifact@v7
      with:
        name: MeshMC-Qt${{ inputs.qt-major }}-${{ inputs.artifact-name }}-${{ inputs.version }}-${{ inputs.build-type }}
        path: MeshMC.zip

    - name: Upload disk image
      uses: actions/upload-artifact@v7
      with:
        name: MeshMC-Qt${{ inputs.qt-major }}-${{ inputs.artifact-name }}-${{ inputs.version }}-${{ inputs.build-type }}.dmg
        path: MeshMC.dmg
