name: Package for Linux
description: Create Linux packages for MeshMC

inputs:
  version:
    description: Launcher version
    required: true
  build-type:
    description: Type for the build
    required: true
    default: Debug
  qt-major:
    description: Major version of Qt used, to keep artifact names distinct
    required: false
    default: "6"

runs:
  using: composite

  steps:
    - name: Install and package
      shell: bash
      env:
        PACKAGE_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || inputs.version }}
      run: |
        cmake --install build --config ${{ inputs.build-type }} --prefix install
        test -x install/MeshMC
        package="$GITHUB_WORKSPACE/MeshMC-Qt${{ inputs.qt-major }}-Linux-x86_64-${PACKAGE_VERSION}.tar.gz"
        python tools/package_release.py \
          --source install \
          --output "$package" \
          --format tar.gz \
          --archive-root MeshMC
        test -s "$package"

    - name: Upload Linux archive
      uses: actions/upload-artifact@v7
      with:
        name: MeshMC-Qt${{ inputs.qt-major }}-Linux-x86_64
        path: ${{ github.workspace }}/MeshMC-Qt${{ inputs.qt-major }}-Linux-x86_64-*.tar.gz
        if-no-files-found: error
