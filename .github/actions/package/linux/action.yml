name: Package for Linux
description: Create Linux packages for MeshMC

inputs:
  version:
    description: Launcher version
    required: true
  build-type:
    description: Type for the build
    required: true
    default: Debug
  artifact-name:
    description: Name of the uploaded artifact
    required: true
    default: Linux
  qt-version:
    description: Version of Qt to use
    required: true
  qt-major:
    description: Major version of Qt used, to keep artifact names distinct
    required: false
    default: "6"
  gpg-private-key:
    description: Private key for AppImage signing
    required: false
  gpg-private-key-id:
    description: ID for the gpg-private-key, to select the signing key
    required: false

runs:
  using: composite

  steps:
    - name: Cleanup Qt installation on Linux
      shell: bash
      run: |
        rm -rf "$QT_PLUGIN_PATH"/printsupport
        rm -rf "$QT_PLUGIN_PATH"/sqldrivers
        rm -rf "$QT_PLUGIN_PATH"/help
        rm -rf "$QT_PLUGIN_PATH"/designer
        rm -rf "$QT_PLUGIN_PATH"/qmltooling
        rm -rf "$QT_PLUGIN_PATH"/qmlls
        rm -rf "$QT_PLUGIN_PATH"/qmllint
        rm -rf "$QT_PLUGIN_PATH"/platformthemes/libqgtk3.so

    - name: Setup build variables
      shell: bash
      run: |
        # AppImage architecture naming (the build runs in a Fedora container,
        # so no dpkg-architecture)
        APPIMAGE_ARCH="$(uname -m)"
        case "$APPIMAGE_ARCH" in
          x86_64|aarch64) ;;
          *)
            echo "# 🚨 The architecture \"$APPIMAGE_ARCH\" is not recognized!" >> "$GITHUB_STEP_SUMMARY"
            exit 1
            ;;
        esac
        echo "APPIMAGE_ARCH=$APPIMAGE_ARCH" >> "$GITHUB_ENV"

    # Qt's own QML modules (QtQuick, QtQuick.Controls, ...) and KDE's
    # (org.kde.kirigami, ...) live in $QT_INSTALL_QML, a directory *sibling
    # to* $QT_PLUGIN_PATH -- the "$QT_PLUGIN_PATH"/*/*.so glob of the package
    # steps never reaches them. This finds the modules launcher/qml/ imports
    # (qmlimportscanner), plus the org.kde.desktop controls style, which the
    # KDE interface asks for by name and nothing imports, and the plugins and
    # data the KDE interface loads at run time:
    #   styles/breeze6, kf6/ktranscript  already in the */*.so glob
    #   kf6/kirigami/platform            Kirigami's desktop integration
    #   kiconthemes6/iconengines         KIconThemes' icon engine
    #   kf6/sonnet                       spell checking in text fields
    #   share/color-schemes              Breeze's colour schemes; sharun puts
    #                                    the AppDir's share/ on XDG_DATA_DIRS
    # Both package steps below copy what it lists.
    - name: Find the QML modules and KDE runtime pieces
      shell: bash
      run: |
        qt_root="$(dirname "${QT_PLUGIN_PATH%/}")"
        QT_QML_PATH="$qt_root/qml"
        qmlimportscanner_bin="$(find "$qt_root" -name qmlimportscanner -type f | head -1)"
        if [[ -z "$qmlimportscanner_bin" ]]; then
          echo "::error::qmlimportscanner not found under $qt_root; cannot determine which Qt QML modules to bundle."
          exit 1
        fi
        scan_roots=(-rootPath launcher/qml)
        if [[ -f "$QT_QML_PATH/org/kde/desktop/qmldir" ]]; then
          scan_roots+=(-rootPath "$QT_QML_PATH/org/kde/desktop")
        else
          echo "::warning::org.kde.desktop is not in $QT_QML_PATH; the KDE interface falls back to Qt's Basic style."
        fi
        "$qmlimportscanner_bin" "${scan_roots[@]}" -importPath "$QT_QML_PATH" \
          | grep -o '"relativePath": *"[^"]*"' | sed -E 's/.*"([^"]*)"$/\1/' | sort -u \
          > "$RUNNER_TEMP/meshmc-qml-modules.txt"
        if [[ ! -s "$RUNNER_TEMP/meshmc-qml-modules.txt" ]]; then
          echo "::error::qmlimportscanner reported no Qt QML modules for launcher/qml"
          exit 1
        fi
        find "$QT_PLUGIN_PATH"/kf6/kirigami/platform "$QT_PLUGIN_PATH"/kiconthemes6/iconengines \
          "$QT_PLUGIN_PATH"/kf6/sonnet -name '*.so' > "$RUNNER_TEMP/meshmc-kde-plugins.txt" || true
        echo "QT_QML_PATH=$QT_QML_PATH" >> "$GITHUB_ENV"
        echo "MESHMC_COLOR_SCHEMES=$(dirname "$(dirname "$qt_root")")/share/color-schemes" >> "$GITHUB_ENV"

    - name: Package AppImage
      shell: bash
      env:
        VERSION: ${{ github.ref_type == 'tag' && github.ref_name || inputs.version }}
        BUILD_DIR: build
        INSTALL_APPIMAGE_DIR: install-appdir

        GPG_PRIVATE_KEY: ${{ inputs.gpg-private-key }}
      run: |
        cmake --install ${{ env.BUILD_DIR }} --config ${{ inputs.build-type }} --prefix ${{ env.INSTALL_APPIMAGE_DIR }}

        if [ '${{ inputs.gpg-private-key-id }}' != '' ]; then
          echo "$GPG_PRIVATE_KEY" > privkey.asc
          gpg --import privkey.asc
          gpg --export --armor ${{ inputs.gpg-private-key-id }} > pubkey.asc
        else
          echo ":warning: Skipped code signing for Linux AppImage, as gpg key was not present." >> $GITHUB_STEP_SUMMARY
        fi

        # Qt dlopen()s OpenSSL rather than linking it, so lib4bin cannot
        # discover it from the binaries and has to be handed the files. Only
        # set for the Qt 5 builds, whose Qt speaks the 1.1.1 API that no
        # current distribution ships; see .github/actions/setup-openssl.
        openssl_libs=()
        if [[ -n "${MESHMC_OPENSSL_LIB_DIR:-}" ]]; then
          openssl_libs=(
            "$MESHMC_OPENSSL_LIB_DIR"/libssl.so.1.1
            "$MESHMC_OPENSSL_LIB_DIR"/libcrypto.so.1.1
          )
        fi

        # The QML modules, KDE plugins and colour schemes found by "Find the
        # QML modules and KDE runtime pieces" above.
        mapfile -t qml_modules < "$RUNNER_TEMP/meshmc-qml-modules.txt"
        mapfile -t kde_plugins < "$RUNNER_TEMP/meshmc-kde-plugins.txt"
        qml_plugin_libs=()
        for m in "${qml_modules[@]}"; do
          mkdir -p "$INSTALL_APPIMAGE_DIR/qml/$(dirname "$m")"
          cp -a "$QT_QML_PATH/$m" "$INSTALL_APPIMAGE_DIR/qml/$m"
          while IFS= read -r -d '' so; do qml_plugin_libs+=("$so"); done < <(find "$QT_QML_PATH/$m" -maxdepth 1 -name '*.so' -print0)
        done
        if [[ -d "$MESHMC_COLOR_SCHEMES" ]]; then
          mkdir -p "$INSTALL_APPIMAGE_DIR/share/color-schemes"
          cp "$MESHMC_COLOR_SCHEMES"/*.colors "$INSTALL_APPIMAGE_DIR/share/color-schemes/"
        fi

        sharun lib4bin \
          --hard-links \
          --with-hooks \
          --dst-dir "$INSTALL_APPIMAGE_DIR" \
          "$INSTALL_APPIMAGE_DIR"/bin/* "$QT_PLUGIN_PATH"/*/*.so "${kde_plugins[@]}" "${qml_plugin_libs[@]}" "${openssl_libs[@]}"

        cp ~/bin/AppImageUpdate.AppImage "$INSTALL_APPIMAGE_DIR"/bin/
        # FIXME(@YongDo-Hyun): gamemode doesn't seem to be very portable with DBus. Find a way to make it work!
        find "$INSTALL_APPIMAGE_DIR" -name '*gamemode*' -exec rm {} +

        #disable OpenGL and Vulkan launcher features until https://github.com/VHSgunzo/sharun/issues/35
        echo "LAUNCHER_DISABLE_GLVULKAN=1" > "$INSTALL_APPIMAGE_DIR"/.env
        #makes the launcher use portals for file picking
        echo "QT_QPA_PLATFORMTHEME=xdgdesktopportal" >> "$INSTALL_APPIMAGE_DIR"/.env
        #points Qt at the QML modules copied in above (AppDir-relative; $APPDIR
        #is exported by the AppImage runtime before AppRun/sharun ever runs)
        echo "QML2_IMPORT_PATH=\$APPDIR/qml" >> "$INSTALL_APPIMAGE_DIR"/.env
        echo "QML_IMPORT_PATH=\$APPDIR/qml" >> "$INSTALL_APPIMAGE_DIR"/.env
        ln -s org.projecttick.MeshMC.metainfo.xml "$INSTALL_APPIMAGE_DIR"/share/metainfo/org.projecttick.MeshMC.appdata.xml
        ln -s share/applications/org.projecttick.MeshMC.desktop "$INSTALL_APPIMAGE_DIR"
        ln -s share/icons/hicolor/256x256/apps/org.projecttick.MeshMC.png "$INSTALL_APPIMAGE_DIR"
        mv "$INSTALL_APPIMAGE_DIR"/{sharun,AppRun}
        ls -la "$INSTALL_APPIMAGE_DIR"

        if [[ "${{ github.ref_type }}" == "tag" ]]; then
          APPIMAGE_DEST="MeshMC-Linux-$APPIMAGE_ARCH.AppImage"
        else
          APPIMAGE_DEST="MeshMC-Linux-$VERSION-${{ inputs.build-type }}-$APPIMAGE_ARCH.AppImage"
        fi

        mkappimage \
          --updateinformation "gh-releases-zsync|${{ github.repository_owner }}|${{ github.event.repository.name }}|latest|MeshMC-Linux-$APPIMAGE_ARCH.AppImage.zsync" \
          "$INSTALL_APPIMAGE_DIR" \
          "$APPIMAGE_DEST"

    - name: Package portable tarball
      shell: bash
      env:
        BUILD_DIR: build

        INSTALL_PORTABLE_DIR: install-portable
      run: |
        cmake --install ${{ env.BUILD_DIR }} --config ${{ inputs.build-type }} --prefix ${{ env.INSTALL_PORTABLE_DIR }}
        cmake --install ${{ env.BUILD_DIR }} --config ${{ inputs.build-type }} --prefix ${{ env.INSTALL_PORTABLE_DIR }} --component portable

        # Same as the AppImage above: the portable tarball carries its own Qt,
        # so it also has to carry the OpenSSL that Qt is able to load.
        openssl_libs=()
        if [[ -n "${MESHMC_OPENSSL_LIB_DIR:-}" ]]; then
          openssl_libs=(
            "$MESHMC_OPENSSL_LIB_DIR"/libssl.so.1.1
            "$MESHMC_OPENSSL_LIB_DIR"/libcrypto.so.1.1
          )
        fi

        # The same QML modules, KDE plugins and colour schemes as the AppImage
        # (launcher/MeshMC.in points Qt at the qml/ copy made here via
        # QML2_IMPORT_PATH/QML_IMPORT_PATH; sharun puts share/ on
        # XDG_DATA_DIRS).
        mapfile -t qml_modules < "$RUNNER_TEMP/meshmc-qml-modules.txt"
        mapfile -t kde_plugins < "$RUNNER_TEMP/meshmc-kde-plugins.txt"
        qml_plugin_libs=()
        for m in "${qml_modules[@]}"; do
          mkdir -p "$INSTALL_PORTABLE_DIR/qml/$(dirname "$m")"
          cp -a "$QT_QML_PATH/$m" "$INSTALL_PORTABLE_DIR/qml/$m"
          while IFS= read -r -d '' so; do qml_plugin_libs+=("$so"); done < <(find "$QT_QML_PATH/$m" -maxdepth 1 -name '*.so' -print0)
        done
        if [[ -d "$MESHMC_COLOR_SCHEMES" ]]; then
          mkdir -p "$INSTALL_PORTABLE_DIR/share/color-schemes"
          cp "$MESHMC_COLOR_SCHEMES"/*.colors "$INSTALL_PORTABLE_DIR/share/color-schemes/"
        fi

        sharun lib4bin \
          --with-hooks \
          --hard-links \
          --dst-dir "$INSTALL_PORTABLE_DIR" \
          "$INSTALL_PORTABLE_DIR"/bin/* "$QT_PLUGIN_PATH"/*/*.so "${kde_plugins[@]}" "${qml_plugin_libs[@]}" "${openssl_libs[@]}"

        # FIXME(@YongDo-Hyun): gamemode doesn't seem to be very portable with DBus. Find a way to make it work!
        find "$INSTALL_PORTABLE_DIR" -name '*gamemode*' -exec rm {} +

        for l in $(find ${{ env.INSTALL_PORTABLE_DIR }} -type f -o -type l); do l=${l#$(pwd)/}; l=${l#${{ env.INSTALL_PORTABLE_DIR }}/}; l=${l#./}; echo $l; done > ${{ env.INSTALL_PORTABLE_DIR }}/manifest.txt
        cd ${{ env.INSTALL_PORTABLE_DIR }}
        tar -czf ../MeshMC-portable.tar.gz *

    - name: Upload portable tarball
      uses: actions/upload-artifact@v7
      with:
        name: MeshMC-${{ inputs.artifact-name }}-Qt${{ inputs.qt-major }}-Portable-${{ inputs.version }}-${{ inputs.build-type }}
        path: MeshMC-portable.tar.gz

    - name: Upload AppImage
      uses: actions/upload-artifact@v7
      with:
        name: MeshMC-${{ runner.os }}-Qt${{ inputs.qt-major }}-${{ inputs.version }}-${{ inputs.build-type }}-${{ env.APPIMAGE_ARCH }}.AppImage
        path: MeshMC-${{ runner.os }}-*${{ env.APPIMAGE_ARCH }}.AppImage

    - name: Upload AppImage Zsync
      uses: actions/upload-artifact@v7
      with:
        name: MeshMC-${{ runner.os }}-Qt${{ inputs.qt-major }}-${{ inputs.version }}-${{ inputs.build-type }}-${{ env.APPIMAGE_ARCH }}.AppImage.zsync
        path: MeshMC-${{ runner.os }}-*${{ env.APPIMAGE_ARCH }}.AppImage.zsync
