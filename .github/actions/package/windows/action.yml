name: Package for Windows
description: Create a Windows package for MeshMC

inputs:
  version:
    description: Launcher version
    required: true
  build-type:
    description: Type for the build
    required: true
    default: Debug
  artifact-name:
    description: Name of the uploaded artifact
    required: true
  msystem:
    description: MSYS2 subsystem to use
    required: false
  windows-codesign-cert:
    description: Certificate for signing Windows builds
    required: false
  windows-codesign-password:
    description: Password for signing Windows builds
    required: false
  qt-major:
    description: Major version of Qt used, to keep artifact names distinct
    required: false
    default: "6"

runs:
  using: composite

  steps:
    - name: Install NSIS
      uses: negrutiu/nsis-install@v3

    - name: Package
      shell: msys2 {0}
      env:
        BUILD_DIR: ${{ github.workspace }}/build
        INSTALL_DIR: ${{ github.workspace }}/install
      run: |
        build_dir="$(cygpath -u "${BUILD_DIR}")"
        install_dir="$(cygpath -u "${INSTALL_DIR}")"
        cmake --install "$build_dir" --config ${{ inputs.build-type }}

    - name: Validate Windows runtime
      shell: pwsh
      env:
        INSTALL_DIR: ${{ github.workspace }}/install
      run: |
        $ErrorActionPreference = 'Stop'
        $requiredFiles = @('MeshMC.exe', 'qt.conf', 'Qt5Core.dll', 'platforms/qwindows.dll')
        foreach ($file in $requiredFiles) {
          $path = Join-Path $env:INSTALL_DIR $file
          if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
            throw "Windows runtime package is missing $file"
          }
        }

    - name: Fetch codesign certificate
      shell: bash # yes, we are not using MSYS2 or PowerShell here
      env:
        WINDOWS_CODESIGN_CERT: ${{ inputs.windows-codesign-cert }}
      run: |
        if [[ -n "$WINDOWS_CODESIGN_CERT" ]]; then
          printf '%s' "$WINDOWS_CODESIGN_CERT" | base64 --decode > codesign.pfx
        else
          : > codesign.pfx
        fi

    - name: Sign executable
      shell: pwsh
      env:
        INSTALL_DIR: ${{ github.workspace }}/install
        CODESIGN_CERT_PATH: ${{ github.workspace }}/codesign.pfx
        CODESIGN_PASSWORD: ${{ inputs.windows-codesign-password }}
      run: |
        if ((Get-Item -LiteralPath $env:CODESIGN_CERT_PATH).Length -gt 0) {
          $installDir = (Resolve-Path -LiteralPath $env:INSTALL_DIR).Path
          $executables = @('MeshMC.exe', 'meshmc-updater.exe', 'meshmc-crashreporter.exe') |
              ForEach-Object { Join-Path $installDir $_ } |
              Where-Object { Test-Path -LiteralPath $_ }
          if (-not ($executables | Where-Object { [IO.Path]::GetFileName($_) -ieq 'MeshMC.exe' })) {
            throw 'The installed MeshMC.exe executable is missing.'
          }
          SignTool sign /fd sha256 /td sha256 /f $env:CODESIGN_CERT_PATH /p $env:CODESIGN_PASSWORD /tr http://timestamp.digicert.com $executables
        } else {
          ":warning: Skipped code signing for Windows, as certificate was not present." >> $env:GITHUB_STEP_SUMMARY
        }

    - name: Package (installer)
      shell: pwsh
      env:
        BUILD_DIR: ${{ github.workspace }}/build
        INSTALL_DIR: ${{ github.workspace }}/install

        NSCURL_VERSION: "v24.9.26.122"
        NSCURL_SHA256: "AEE6C4BE3CB6455858E9C1EE4B3AFE0DB9960FA03FE99CCDEDC28390D57CCBB0"
      run: |
        New-Item -Name NSISPlugins -ItemType Directory
        Invoke-Webrequest https://github.com/negrutiu/nsis-nscurl/releases/download/"${{ env.NSCURL_VERSION }}"/NScurl.zip -OutFile NSISPlugins\NScurl.zip
        $nscurl_hash = Get-FileHash NSISPlugins\NScurl.zip -Algorithm Sha256 | Select-Object -ExpandProperty Hash
        if ( $nscurl_hash -ne "${{ env.nscurl_sha256 }}") {
          echo "::error:: NSCurl.zip sha256 mismatch"
          exit 1
        }
        Expand-Archive -Path NSISPlugins\NScurl.zip -DestinationPath NSISPlugins\NScurl

        $nsisScript = Resolve-Path (Join-Path "${{ env.BUILD_DIR }}" "win_install.nsi")
        cd ${{ env.INSTALL_DIR }}
        makensis -NOCD "$nsisScript"
        if (-not (Test-Path -LiteralPath "${{ github.workspace }}/MeshMC-Setup.exe" -PathType Leaf)) {
          throw 'NSIS did not produce MeshMC-Setup.exe.'
        }

    - name: Sign installer
      shell: pwsh
      env:
        CODESIGN_CERT_PATH: ${{ github.workspace }}/codesign.pfx
        INSTALLER_PATH: ${{ github.workspace }}/MeshMC-Setup.exe
        CODESIGN_PASSWORD: ${{ inputs.windows-codesign-password }}
      run: |
          if ((Get-Item -LiteralPath $env:CODESIGN_CERT_PATH).Length -gt 0) {
            SignTool sign /fd sha256 /td sha256 /f $env:CODESIGN_CERT_PATH /p $env:CODESIGN_PASSWORD /tr http://timestamp.digicert.com $env:INSTALLER_PATH
          } else {
            ":warning: Skipped code signing for Windows, as certificate was not present." >> $env:GITHUB_STEP_SUMMARY
          }

    - name: Upload binary zip
      uses: actions/upload-artifact@v7
      with:
        name: MeshMC-Qt${{ inputs.qt-major }}-${{ inputs.artifact-name }}-${{ inputs.version }}-${{ inputs.build-type }}
        path: ${{ github.workspace }}/install/**

    - name: Upload installer
      uses: actions/upload-artifact@v7
      with:
        name: MeshMC-Qt${{ inputs.qt-major }}-${{ inputs.artifact-name }}-Setup-${{ inputs.version }}-${{ inputs.build-type }}
        path: ${{ github.workspace }}/MeshMC-Setup.exe
