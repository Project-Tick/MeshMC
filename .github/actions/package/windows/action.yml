name: Package for Windows
description: Create a Windows package for MeshMC

inputs:
  version:
    description: Launcher version
    required: true
  build-type:
    description: Type for the build
    required: true
    default: Debug
  msystem:
    description: MSYS2 subsystem to use
    required: false
  windows-codesign-cert:
    description: Certificate for signing Windows builds
    required: false
  windows-codesign-password:
    description: Password for signing Windows builds
    required: false
  qt-major:
    description: Major version of Qt used, to keep artifact names distinct
    required: false
    default: "6"

runs:
  using: composite

  steps:
    - name: Package
      shell: msys2 {0}
      env:
        BUILD_DIR: ${{ github.workspace }}/build
        INSTALL_DIR: ${{ github.workspace }}/install
      run: |
        build_dir="$(cygpath -u "${BUILD_DIR}")"
        install_dir="$(cygpath -u "${INSTALL_DIR}")"
        cmake --install "$build_dir" --config ${{ inputs.build-type }}
        qt_bin="${MINGW_PREFIX:-}/bin"
        windeployqt="$(find "$qt_bin" -maxdepth 1 -iname 'windeployqt*.exe' -print -quit)"
        if [[ -z "$windeployqt" ]]; then
          windeployqt="$(command -v windeployqt.exe || command -v windeployqt || true)"
        fi
        if [[ -z "$windeployqt" ]]; then
          echo "::error::windeployqt is missing."
          exit 1
        fi
        "$windeployqt" --compiler-runtime --no-translations --no-opengl-sw "$install_dir/MeshMC.exe"
        test -f "$install_dir/Qt5Core.dll"
        test -f "$install_dir/platforms/qwindows.dll"

    - name: Validate Windows runtime
      shell: pwsh
      env:
        INSTALL_DIR: ${{ github.workspace }}/install
      run: |
        $ErrorActionPreference = 'Stop'
        $requiredFiles = @('MeshMC.exe', 'qt.conf', 'Qt5Core.dll', 'platforms/qwindows.dll')
        foreach ($file in $requiredFiles) {
          $path = Join-Path $env:INSTALL_DIR $file
          if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
            throw "Windows runtime package is missing $file"
          }
        }

    - name: Fetch codesign certificate
      shell: bash # yes, we are not using MSYS2 or PowerShell here
      env:
        WINDOWS_CODESIGN_CERT: ${{ inputs.windows-codesign-cert }}
      run: |
        if [[ -n "$WINDOWS_CODESIGN_CERT" ]]; then
          printf '%s' "$WINDOWS_CODESIGN_CERT" | base64 --decode > codesign.pfx
        else
          : > codesign.pfx
        fi

    - name: Sign executable
      shell: pwsh
      env:
        INSTALL_DIR: ${{ github.workspace }}/install
        CODESIGN_CERT_PATH: ${{ github.workspace }}/codesign.pfx
        CODESIGN_PASSWORD: ${{ inputs.windows-codesign-password }}
      run: |
        if ((Get-Item -LiteralPath $env:CODESIGN_CERT_PATH).Length -gt 0) {
          $installDir = (Resolve-Path -LiteralPath $env:INSTALL_DIR).Path
          $executables = @('MeshMC.exe', 'meshmc-updater.exe', 'meshmc-crashreporter.exe') |
              ForEach-Object { Join-Path $installDir $_ } |
              Where-Object { Test-Path -LiteralPath $_ }
          if (-not ($executables | Where-Object { [IO.Path]::GetFileName($_) -ieq 'MeshMC.exe' })) {
            throw 'The installed MeshMC.exe executable is missing.'
          }
          SignTool sign /fd sha256 /td sha256 /f $env:CODESIGN_CERT_PATH /p $env:CODESIGN_PASSWORD /tr http://timestamp.digicert.com $executables
        } else {
          ":warning: Skipped code signing for Windows, as certificate was not present." >> $env:GITHUB_STEP_SUMMARY
        }

    - name: Install NSIS
      uses: negrutiu/nsis-install@v3

    - name: Create NSIS installer
      shell: pwsh
      env:
        PACKAGE_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || inputs.version }}
        BUILD_DIR: ${{ github.workspace }}/build
        INSTALL_DIR: ${{ github.workspace }}/install
        CODESIGN_CERT_PATH: ${{ github.workspace }}/codesign.pfx
        CODESIGN_PASSWORD: ${{ inputs.windows-codesign-password }}
      run: |
        $ErrorActionPreference = 'Stop'
        $script = (Resolve-Path -LiteralPath (Join-Path $env:BUILD_DIR 'win_install.nsi')).Path
        $installer = Join-Path $env:GITHUB_WORKSPACE 'MeshMC-Setup.exe'
        $package = Join-Path $env:GITHUB_WORKSPACE "MeshMC-Qt${{ inputs.qt-major }}-Windows-x86_64-Setup-$($env:PACKAGE_VERSION).exe"

        # The configured script reads the deployed runtime from its working directory.
        Push-Location -LiteralPath $env:INSTALL_DIR
        try {
          makensis -NOCD "$script"
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $installer -PathType Leaf)) {
            throw 'NSIS did not produce MeshMC-Setup.exe.'
          }
        } finally {
          Pop-Location
        }

        if ((Get-Item -LiteralPath $env:CODESIGN_CERT_PATH).Length -gt 0) {
          SignTool sign /fd sha256 /td sha256 /f $env:CODESIGN_CERT_PATH /p $env:CODESIGN_PASSWORD /tr http://timestamp.digicert.com $installer
          if ($LASTEXITCODE -ne 0) {
            throw 'Could not sign the Windows installer.'
          }
        }
        Move-Item -LiteralPath $installer -Destination $package

    - name: Upload Windows installer
      uses: actions/upload-artifact@v7
      with:
        name: MeshMC-Qt${{ inputs.qt-major }}-Windows-x86_64-Setup
        path: ${{ github.workspace }}/MeshMC-Qt${{ inputs.qt-major }}-Windows-x86_64-Setup-*.exe
        if-no-files-found: error

    - name: Create ZIP package
      shell: pwsh
      env:
        PACKAGE_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || inputs.version }}
        INSTALL_DIR: ${{ github.workspace }}/install
      run: |
        $package = Join-Path $env:GITHUB_WORKSPACE "MeshMC-Qt${{ inputs.qt-major }}-Windows-x86_64-$($env:PACKAGE_VERSION).zip"
        python "$env:GITHUB_WORKSPACE/tools/package_release.py" `
          --source $env:INSTALL_DIR `
          --output $package `
          --format zip `
          --archive-root MeshMC
        if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $package -PathType Leaf)) {
          throw 'Could not create the Windows ZIP package.'
        }

    - name: Upload Windows archive
      uses: actions/upload-artifact@v7
      with:
        name: MeshMC-Qt${{ inputs.qt-major }}-Windows-x86_64
        path: ${{ github.workspace }}/MeshMC-Qt${{ inputs.qt-major }}-Windows-x86_64-*.zip
        if-no-files-found: error
