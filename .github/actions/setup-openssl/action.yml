name: Setup bundled OpenSSL

inputs:
  msystem:
    description: MSYS2 subsystem, when building with MinGW
    required: false

runs:
  using: composite

  steps:
    ##
    # MinGW / MSYS2 -- OpenSSL comes from pacman.
    #
    # The only build that still needs OpenSSL bundled. Qt 6 on Windows falls
    # back to Schannel, so the MSVC builds ship without it; MSYS2's Qt is
    # linked against the OpenSSL in its own prefix, which does not exist on a
    # user's machine, so those DLLs have to travel with the package.
    #
    # Everything else this action used to do existed for the Qt 5 builds
    # (OpenSSL 1.1.1 from source for MSVC and Linux) and went away with them.
    ##
    - name: Locate MSYS2 OpenSSL (MinGW)
      if: ${{ inputs.msystem != '' }}
      shell: msys2 {0}
      run: |
        set -euo pipefail

        ssl="$(ls "$MINGW_PREFIX"/bin/libssl-*.dll 2>/dev/null | head -1 || true)"
        crypto="$(ls "$MINGW_PREFIX"/bin/libcrypto-*.dll 2>/dev/null | head -1 || true)"

        if [[ -z "$ssl" || -z "$crypto" ]]; then
          echo "# 🚨 No OpenSSL runtime found in $MINGW_PREFIX/bin" >> "$GITHUB_STEP_SUMMARY"
          exit 1
        fi

        # cygpath -m: Windows path with forward slashes, which is what CMake
        # wants. Backslashes would be eaten as escapes in the -D value.
        echo "MESHMC_BUNDLE_OPENSSL_LIBS=$(cygpath -m "$ssl");$(cygpath -m "$crypto")" >> "$GITHUB_ENV"
