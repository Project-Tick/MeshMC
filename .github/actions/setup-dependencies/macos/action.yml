name: Setup macOS dependencies

inputs:
  build-type:
    description: Type for the build
    required: true
    default: Debug
  qt-major:
    description: Major version of Qt to use
    required: true

runs:
  using: composite

  steps:
    - name: Install dependencies
      shell: bash
      run: |
        brew update
        brew install ninja temurin@17 autoconf pkg-config \
        autoconf-archive automake libtool

    - name: Setup vcpkg cache
      shell: bash
      env:
        USERNAME: ${{ github.repository_owner }}
        GITHUB_TOKEN: ${{ github.token }}
        FEED_URL: https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json
      run: |
        mono `vcpkg fetch nuget | tail -n 1` \
          sources add \
          -Source "$FEED_URL" \
          -StorePasswordInClearText \
          -Name GitHubPackages \
          -UserName "$USERNAME" \
          -Password "$GITHUB_TOKEN"
        mono `vcpkg fetch nuget | tail -n 1` \
          setapikey "$GITHUB_TOKEN" \
          -Source "$FEED_URL"
        echo "VCPKG_BINARY_SOURCES=clear;nuget,$FEED_URL,readwrite" >> "$GITHUB_ENV"
        # Own package ids, see the Windows step: the plain vcpkg ids in the org feed belong to
        # packages GITHUB_TOKEN may not write to (403 Forbidden).
        echo "X_VCPKG_NUGET_ID_PREFIX=meshmc." >> "$GITHUB_ENV"

    - name: Install Qt5
      if: ${{ inputs.qt-major == '5' }}
      shell: bash
      run: |
        brew install qt@5
        brew unlink qt@5 || true
        QT5_PREFIX="$(brew --prefix qt@5)"
        echo "CMAKE_PREFIX_PATH=$QT5_PREFIX" >> "$GITHUB_ENV"
        echo "Qt5_ROOT=$QT5_PREFIX" >> "$GITHUB_ENV"
        echo "$QT5_PREFIX/bin" >> "$GITHUB_PATH"
        ls -l /opt/homebrew/lib/cmake | grep -i qt || echo "no Qt cmake files linked in /opt/homebrew/lib/cmake"

    - name: Set JAVA_HOME
      shell: bash
      run: |
        echo "JAVA_HOME=$(/usr/libexec/java_home -v 17)" >> "$GITHUB_ENV"
