name: Setup macOS dependencies

inputs:
  build-type:
    description: Type for the build
    required: true
    default: Debug
  qt-major:
    description: Major version of Qt to use
    required: true

runs:
  using: composite

  steps:
    - name: Install dependencies
      shell: bash
      run: |
        brew update
        brew install cmake ninja temurin@17 autoconf pkg-config \
        autoconf-archive automake libtool gettext libxml2 zlib \
        bzip2 xz gperf cmark docbook docbook-xsl cpanminus libxslt

        cpanm URI
        echo "SDKROOT=$(xcrun --sdk macosx --show-sdk-path)" >> "$GITHUB_ENV"
        echo "PKG_CONFIG_PATH=$(brew --prefix libxml2)/lib/pkgconfig:$(brew --prefix libxslt)/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}" >> "$GITHUB_ENV"

    - name: Install Qt5
      if: ${{ inputs.qt-major == '5' }}
      shell: bash
      run: |
        brew install qt@5
        brew unlink qt@5 || true
        QT5_PREFIX="$(brew --prefix qt@5)"
        echo "CMAKE_PREFIX_PATH=$QT5_PREFIX" >> "$GITHUB_ENV"
        echo "Qt5_ROOT=$QT5_PREFIX" >> "$GITHUB_ENV"
        echo "$QT5_PREFIX/bin" >> "$GITHUB_PATH"
        ls -l /opt/homebrew/lib/cmake | grep -i qt || echo "no Qt cmake files linked in /opt/homebrew/lib/cmake"

    - name: Set JAVA_HOME
      shell: bash
      run: |
        echo "JAVA_HOME=$(/usr/libexec/java_home -v 17)" >> "$GITHUB_ENV"
