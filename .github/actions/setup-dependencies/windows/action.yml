name: Setup Windows Dependencies
description: Install and setup dependencies for building MeshMC

inputs:
  build-type:
    description: Type for the build
    required: true
    default: Debug
  msystem:
    description: MSYS2 subsystem to use
    required: false
  vcvars-arch:
    description: Visual Studio architecture to use
    required: true
    default: amd64

runs:
  using: composite

  steps:
    # NOTE: Installed on MinGW as well for SignTool
    - name: Enter VS Developer shell
      if: ${{ runner.os == 'Windows' }}
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: ${{ inputs.vcvars-arch }}

    - name: Setup MSYS2
      uses: msys2/setup-msys2@v2
      with:
        msystem: ${{ inputs.msystem }}
        update: true
        install: >-
          git
        pacboy: >-
          toolchain:p
          ccache:p
          cmake:p
          ninja:p
          qt5-base:p
          qt5-svg:p
          qt5-imageformats:p
          qt5-networkauth:p
          qt5-tools:p
          angleproject:p

    - name: List pacman packages
      shell: msys2 {0}
      run: |
        pacman -Qe

    - name: Retrieve ccache cache
      uses: actions/cache@v6.1.0
      with:
        path: '${{ github.workspace }}\.ccache'
        key: ${{ runner.os }}-w64-ccache-${{ github.run_id }}
        restore-keys: |
          ${{ runner.os }}-w64-ccache

    - name: Setup ccache
      shell: msys2 {0}
      run: |
        ccache --set-config=cache_dir='${{ github.workspace }}\.ccache'
        ccache --set-config=max_size='500M'
        ccache --set-config=compression=true
        ccache -p  # Show config
