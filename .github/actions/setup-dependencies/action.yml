name: Setup Dependencies
description: Install and setup dependencies for building MeshMC

inputs:
  build-type:
    description: Type for the build
    required: true
    default: Debug
  artifact-name:
    description: Name of the uploaded artifact
    required: true
  msystem:
    description: MSYS2 subsystem to use
    required: false
  vcvars-arch:
    description: Visual Studio architecture to use
    required: false
  qt-architecture:
    description: Qt architecture
    required: false
  qt-version:
    description: Version of Qt to use
    required: true
  qt-major:
    description: Major version of Qt to use
    required: true

outputs:
  build-type:
    description: Type of build used
    value: ${{ inputs.build-type }}
  qt-version:
    description: Version of Qt used
    value: ${{ inputs.qt-version }}

runs:
  using: composite

  steps:
    - name: Setup Linux dependencies
      if: ${{ runner.os == 'Linux' }}
      uses: ./.github/actions/setup-dependencies/linux

    - name: Setup macOS dependencies
      if: ${{ runner.os == 'macOS' }}
      uses: ./.github/actions/setup-dependencies/macos
      with:
        build-type: ${{ inputs.build-type }}
        qt-major: ${{ inputs.qt-major }}

    - name: Setup Windows dependencies
      if: ${{ runner.os == 'Windows' }}
      uses: ./.github/actions/setup-dependencies/windows
      with:
        build-type: ${{ inputs.build-type }}
        msystem: ${{ inputs.msystem }}
        vcvars-arch: ${{ inputs.vcvars-arch }}
        qt-major: ${{ inputs.qt-major }}

    # TODO(@YongDo-Hyun): Get this working on MSYS2!
    - name: Setup ccache
      if: ${{ (runner.os != 'Windows' || inputs.msystem == '') && inputs.build-type == 'Debug' }}
      uses: hendrikmuhs/ccache-action@v1.2.24
      with:
        variant: sccache
        create-symlink: ${{ runner.os != 'Windows' }}
        key: ${{ runner.os }}-${{ runner.arch }}-${{ inputs.artifact-name }}-sccache

    - name: Use ccache on debug builds
      if: ${{ inputs.build-type == 'Debug' }}
      shell: bash
      env:
        # Only use ccache on MSYS2
        CCACHE_VARIANT: ${{ (runner.os == 'Windows' && inputs.msystem != '') && 'ccache' || 'sccache' }}
      run: |
        echo "CMAKE_C_COMPILER_LAUNCHER=$CCACHE_VARIANT" >> "$GITHUB_ENV"
        echo "CMAKE_CXX_COMPILER_LAUNCHER=$CCACHE_VARIANT" >> "$GITHUB_ENV"

    - name: Determine vcpkg triplet
      shell: bash
      run: |
        declare vcpkg_arch vcpkg_platform

        case "$RUNNER_ARCH" in
        "X64")
        	vcpkg_arch=x64
        	;;
        "ARM64")
          vcpkg_arch=arm64
          ;;
        *)
        	echo "# 🚨 The architecture \"$RUNNER_ARCH\" is not supported by vcpkg in CI!" >>"$GITHUB_STEP_SUMMARY"
        	exit 1
        	;;
        esac

        case "$RUNNER_OS" in
        "Linux")
        	vcpkg_platform=linux
        	;;
        "macOS")
        	vcpkg_arch=universal
        	vcpkg_platform=osx
        	;;
        "Windows")
        	if [[ "${{ inputs.msystem }}" != "" ]]; then
        		vcpkg_platform=mingw-static-release
        	else
        		vcpkg_platform=windows
        	fi
        	;;
        *)
        	echo "# 🚨 The platform \"$platform\" is not supported by vcpkg in CI!" >>"$GITHUB_STEP_SUMMARY"
        	exit 1
        	;;
        esac

        echo "VCPKG_TRIPLET=$vcpkg_arch-$vcpkg_platform" >> "$GITHUB_ENV"
    # Qt, KDE Frameworks 6 and the rest of what the top-level CMakeLists.txt
    # finds, on the platforms that have no package manager carrying KDE
    # Frameworks: KDE Craft's binary cache, as KDE's own CI uses it. Linux
    # gets them from Fedora and MinGW from MSYS2 (see their actions).
    #
    # The Qt modules: qtquick3d is the optional 3D skin preview's only extra
    # Qt dependency; qtshadertools is listed alongside it because Quick3D
    # bakes its shader variants through it at runtime. The KDE ones:
    # find_package(KF6 ... COMPONENTS ...) plus what the KDE interface only
    # loads at run time (qqc2-desktop-style, kirigami-addons, Plasma's
    # breeze for its widget style and colour schemes). gpgmepp is
    # MeshMC_PLUGIN_SIGNATURES, on by default everywhere but MSVC.
    - name: Setup KDE Craft (macOS, Windows MSVC)
      if: ${{ runner.os == 'macOS' || (runner.os == 'Windows' && inputs.msystem == '') }}
      uses: ./.github/actions/setup-craft
      with:
        target: ${{ runner.os == 'Windows' && 'windows-msvc2026_64-cl' || (runner.arch == 'ARM64' && 'macos-arm-clang' || 'macos-64-clang') }}
        root: ${{ runner.os == 'Windows' && 'C:/craft' || format('{0}/craft', runner.temp) }}
        packages: >-
          libs/qt6/qtbase libs/qt6/qtdeclarative libs/qt6/qtsvg libs/qt6/qttools
          libs/qt6/qtimageformats libs/qt6/qtnetworkauth
          libs/qt6/qtquick3d libs/qt6/qtshadertools
          extra-cmake-modules ki18n kcoreaddons kguiaddons kirigami kiconthemes
          breeze-icons kcolorscheme qqc2-desktop-style kirigami-addons breeze
          cmark libarchive zlib
          ${{ runner.os == 'macOS' && 'libs/gpgme/gpgmepp' || '' }}

    - name: Setup bundled OpenSSL
      uses: ./.github/actions/setup-openssl
      with:
        msystem: ${{ inputs.msystem }}
