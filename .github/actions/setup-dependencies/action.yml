name: Setup Dependencies
description: Install and setup dependencies for building MeshMC

inputs:
  build-type:
    description: Type for the build
    required: true
    default: Debug
  artifact-name:
    description: Name of the uploaded artifact
    required: true
  msystem:
    description: MSYS2 subsystem to use
    required: false
  vcvars-arch:
    description: Visual Studio architecture to use
    required: false
  qt-architecture:
    description: Qt architecture
    required: false
  qt-version:
    description: Version of Qt to use
    required: true
  qt-major:
    description: Major version of Qt to use
    required: true

outputs:
  build-type:
    description: Type of build used
    value: ${{ inputs.build-type }}
  qt-version:
    description: Version of Qt used
    value: ${{ inputs.qt-version }}

runs:
  using: composite

  steps:
    - name: Setup Linux dependencies
      if: ${{ runner.os == 'Linux' }}
      uses: ./.github/actions/setup-dependencies/linux

    - name: Setup macOS dependencies
      if: ${{ runner.os == 'macOS' }}
      uses: ./.github/actions/setup-dependencies/macos
      with:
        build-type: ${{ inputs.build-type }}
        qt-major: ${{ inputs.qt-major }}

    - name: Setup Windows dependencies
      if: ${{ runner.os == 'Windows' }}
      uses: ./.github/actions/setup-dependencies/windows
      with:
        build-type: ${{ inputs.build-type }}
        msystem: ${{ inputs.msystem }}
        vcvars-arch: ${{ inputs.vcvars-arch }}
        qt-major: ${{ inputs.qt-major }}

    # TODO(@YongDo-Hyun): Get this working on MSYS2!
    - name: Setup ccache
      if: ${{ (runner.os != 'Windows' || inputs.msystem == '') && inputs.build-type == 'Debug' }}
      uses: hendrikmuhs/ccache-action@v1.2.24
      with:
        variant: sccache
        create-symlink: ${{ runner.os != 'Windows' }}
        key: ${{ runner.os }}-${{ runner.arch }}-${{ inputs.artifact-name }}-sccache

    - name: Use ccache on debug builds
      if: ${{ inputs.build-type == 'Debug' }}
      shell: bash
      env:
        # Only use ccache on MSYS2
        CCACHE_VARIANT: ${{ (runner.os == 'Windows' && inputs.msystem != '') && 'ccache' || 'sccache' }}
      run: |
        echo "CMAKE_C_COMPILER_LAUNCHER=$CCACHE_VARIANT" >> "$GITHUB_ENV"
        echo "CMAKE_CXX_COMPILER_LAUNCHER=$CCACHE_VARIANT" >> "$GITHUB_ENV"

    - name: Install Qt 5
      if: ${{ inputs.msystem == '' && inputs.qt-major == '5' && runner.os != 'macOS' }}
      uses: jurplel/install-qt-action@v4
      with:
        aqtversion: "==3.1.*"
        version: ${{ inputs.qt-version }}
        modules: qtnetworkauth
        cache: ${{ inputs.build-type == 'Debug' }}

    - name: Install Qt 6
      if: ${{ inputs.msystem == '' && inputs.qt-major == '6' }}
      uses: jurplel/install-qt-action@v4
      with:
        aqtversion: "==3.1.*"
        version: ${{ inputs.qt-version }}
        modules: qtimageformats qtnetworkauth
        cache: ${{ inputs.build-type == 'Debug' }}

    - name: Restore KDE Frameworks cache
      id: kf-cache
      uses: actions/cache@v4
      with:
        path: ${{ runner.temp }}/meshmc-kf-prefix
        key: >-
          meshmc-kf-${{ runner.os }}-${{ runner.arch }}-${{ inputs.msystem || 'native' }}-${{ inputs.qt-major }}-${{ inputs.qt-version }}-${{ inputs.qt-architecture || 'default' }}-${{ inputs.build-type }}-${{ inputs.qt-major == '5' && 'kf5.116.0' || 'kf6.4.0' }}-v1

    - name: Build KDE Frameworks
      shell: ${{ runner.os == 'Windows' && inputs.msystem != '' && 'msys2 {0}' || runner.os == 'Windows' && 'pwsh' || 'bash' }}
      env:
        QT_MAJOR: ${{ inputs.qt-major }}
        QT_VERSION: ${{ inputs.qt-version }}
        QT_ARCHITECTURE: ${{ inputs.qt-architecture }}
        BUILD_TYPE: ${{ inputs.build-type }}
        MSYSTEM_INPUT: ${{ inputs.msystem }}
        KDE_PREFIX: ${{ runner.temp }}/meshmc-kf-prefix
        KF_CACHE_HIT: ${{ steps.kf-cache.outputs.cache-hit }}
      run: python launcher/scripts/ci/build-kde-frameworks.py

    - name: Setup bundled OpenSSL
      uses: ./.github/actions/setup-openssl
      with:
        qt-major: ${{ inputs.qt-major }}
        msystem: ${{ inputs.msystem }}
