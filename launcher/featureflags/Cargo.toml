[package]
name = "meshmc-featureflags"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Network-free Unleash feature-flag evaluation engine for MeshMC, exposed to C++ via cxx."

[lib]
# The Rust sources live directly next to the C++ that consumes them
# (FeatureFlags.{h,cpp}), with no separate src/ directory — analogous to how
# Qt's moc output sits beside its source. Point cargo at lib.rs explicitly so
# it does not look for the default src/lib.rs.
path = "lib.rs"
# staticlib for linking into the launcher; rlib so the cxx bridge and unit
# tests can build against it.
crate-type = ["staticlib", "rlib"]

[dependencies]
cxx.workspace = true
serde.workspace = true
serde_json.workspace = true

[build-dependencies]
# We generate the C++ side of the cxx bridge ourselves (build.rs), rather than
# depending on Corrosion's corrosion_add_cxxbridge() helper. This keeps the
# CMake side dependency-light and frees the Rust sources from Corrosion's
# hard-coded src/ layout requirement: everything lives flat in
# launcher/featureflags/, next to FeatureFlags.{h,cpp}.
cxx-build.workspace = true
